  padding: 8px 10px; background: #0d1020; border-radius: 8px; margin-bottom: 10px;
}
.tk-gas .gas-pill {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 3px 6px; border-radius: 5px; background: #14172a;
  color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums;
  cursor: pointer; transition: background .12s;
}
.tk-gas .gas-pill:hover { background: #1a1d33; }
.tk-gas .gas-pill.on { background: rgba(20,241,149,.14); color: #88f3c3; }

.tk-buy-cta {
  appearance: none; cursor: pointer; width: 100%;
  background: linear-gradient(180deg, #14f195, #0fc879);
  color: #06231a; border: 0;
  font: inherit; font-size: 14px; font-weight: 800;
  padding: 12px; border-radius: 9px;
  letter-spacing: -.005em;
  box-shadow: 0 4px 16px -4px rgba(20, 241, 149, .55);
  transition: transform .12s, filter .12s;
}
.tk-buy-cta:hover { filter: brightness(1.05); transform: translateY(-1px); }
.tk-buy-cta.sell {
  background: linear-gradient(180deg, #ff5a76, #e8395a);
  color: #fff;
  box-shadow: 0 4px 16px -4px rgba(255, 90, 118, .55);
}

/* Time-period change strip */
.tk-tf {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  margin-top: 12px;
}
.tk-tf > div {
  display: grid; gap: 1px; padding: 7px 6px; border-radius: 7px;
  background: #11142a; text-align: center;
}
.tk-tf .lbl { font-size: 9.5px; color: #565a76; font-weight: 600; letter-spacing: .04em; }
.tk-tf .val { font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.tk-tf .val.pos { color: #14f195; }
.tk-tf .val.neg { color: #ff5a76; }

/* Token Data & Security grid */
.tk-sec-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
}
.tk-sec-grid > div {
  background: #11142a; border-radius: 8px; padding: 8px;
  display: grid; gap: 1px;
}
.tk-sec-grid .ic {
  font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px;
}
.tk-sec-grid .v {
  font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text);
}
.tk-sec-grid .v.pos { color: #14f195; }
.tk-sec-grid .v.neg { color: #ff5a76; }
.tk-sec-grid .v.warn { color: #ffce91; }
.tk-sec-grid .lbl-sm { font-size: 9.5px; color: #565a76; font-weight: 500; }

.tk-addr-row {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 9px; border-radius: 7px;
  background: #11142a; margin-top: 6px;
  font-size: 11px; color: var(--muted);
}
.tk-addr-row .lbl { color: #565a76; font-weight: 600; flex-shrink: 0; }
.tk-addr-row .addr {
  font-family: 'JetBrains Mono', monospace; color: var(--text);
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tk-addr-row a, .tk-addr-row button {
  background: transparent; border: 0; cursor: pointer;
  color: var(--muted); font-size: 12px; padding: 0; flex-shrink: 0;
  text-decoration: none; transition: color .12s;
}
.tk-addr-row a:hover, .tk-addr-row button:hover { color: var(--text); }

/* Topbar Connect Wallet button */
.wallet-btn {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  background: linear-gradient(135deg, #9945ff, #7b61ff);
  color: #fff; border: 1px solid rgba(153,69,255,.5);
  font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 7px 13px; border-radius: 9px;
  white-space: nowrap; transition: filter .12s, transform .12s;
}
.wallet-btn:hover { filter: brightness(1.1); }
.wallet-btn.connected {
  background: rgba(20,241,149,.12); color: #88f3c3;
  border-color: rgba(20,241,149,.4);
}
.wallet-btn .dot {
  width: 6px; height: 6px; border-radius: 50%; background: #14f195;
  box-shadow: 0 0 6px #14f195;
}

/* Token page: header action buttons (star / alert) */
.tk-head-acts { display: inline-flex; gap: 6px; align-items: center; }
.tk-icon-btn {
  appearance: none; cursor: pointer;
  width: 30px; height: 30px; border-radius: 8px;
  background: #11142a; border: 1px solid #1c1f2e;
  color: var(--muted); font-size: 14px;
  display: inline-grid; place-items: center;
  transition: color .12s, border-color .12s, background .12s;
}
.tk-icon-btn:hover { color: var(--text); border-color: #2b3047; }
.tk-icon-btn.active { color: #ffd166; border-color: rgba(255,209,102,.4); background: rgba(255,209,102,.1); }
.tk-icon-btn.alert-on { color: #88aafc; border-color: rgba(136,170,252,.4); background: rgba(136,170,252,.1); }

/* PnL calculator widget */
.tk-pnl {
  display: grid; gap: 8px;
}
.tk-pnl-row { display: flex; gap: 6px; }
.tk-pnl-row .tk-amt-input { flex: 1; margin-bottom: 0; }
.tk-pnl-out {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  padding: 9px; border-radius: 8px; background: #0d1020;
}
.tk-pnl-out > div { display: grid; gap: 1px; }
.tk-pnl-out .lbl { font-size: 9.5px; color: #565a76; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.tk-pnl-out .v { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); }
.tk-pnl-out .v.pos { color: #14f195; }
.tk-pnl-out .v.neg { color: #ff5a76; }

/* Live trade tape rows */
.trade-row-buy  td:nth-child(2) { color: #14f195; font-weight: 700; }
.trade-row-sell td:nth-child(2) { color: #ff5a76; font-weight: 700; }
.tk-tape-status {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--muted); padding: 6px 12px;
}
.tk-tape-status .dot {
  width: 6px; height: 6px; border-radius: 50%; background: #565a76;
}
.tk-tape-status.live .dot { background: #14f195; box-shadow: 0 0 6px #14f195; animation: pulse-dot 2s infinite; }

/* Similar tokens grid */
.tk-similar {
  display: grid; gap: 6px; padding: 10px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.tk-sim-card {
  display: flex; align-items: center; gap: 8px;
  padding: 8px; border-radius: 8px; cursor: pointer;
  background: #11142a; border: 1px solid #1c1f2e;
  transition: background .12s, border-color .12s;
}
.tk-sim-card:hover { background: #1a1d33; border-color: #2b3047; }
.tk-sim-card img, .tk-sim-card .ph {
  width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; background: #14172a;
}
.tk-sim-card .ph { display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #0a0820;
  background: linear-gradient(135deg, #9945ff, #14f195); }
.tk-sim-card .info { min-width: 0; flex: 1; }
.tk-sim-card .sym { font-size: 12px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-sim-card .mc { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Keyboard nav hint */
.tk-navhint {
  font-size: 10px; color: #565a76;
}
.tk-navhint kbd {
  background: #14172a; border: 1px solid #1c1f2e; border-radius: 4px;
  padding: 1px 5px; font-family: inherit; font-size: 10px; color: var(--muted);
}

/* Token watchlist section on watchlist page */
.tokenwatch-grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
}
.tw-card {
  display: flex; align-items: center; gap: 10px;
  padding: 12px; border-radius: 12px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--stroke);
  transition: transform .15s, border-color .15s;
}
.tw-card:hover { transform: translateY(-2px); border-color: var(--stroke-strong); }
.tw-card img, .tw-card .ph {
  width: 38px; height: 38px; border-radius: 9px; flex-shrink: 0; background: var(--surface-2);
}
.tw-card .ph { display: grid; place-items: center; font-weight: 700; color: #0a0820;
  background: linear-gradient(135deg, #9945ff, #14f195); }
.tw-card .info { flex: 1; min-width: 0; }
.tw-card .sym { font-weight: 700; font-size: 14px; }
.tw-card .mc { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tw-card .rm {
  appearance: none; background: transparent; border: 0; cursor: pointer;
  color: var(--muted-2); font-size: 14px;
}
.tw-card .rm:hover { color: var(--neg); }

/* ===== Rewards / Referral page ===== */
.rw-hero {
  position: relative; overflow: hidden;
  padding: 32px clamp(20px, 4vw, 44px); border-radius: 18px;
  background: linear-gradient(135deg, rgba(153,69,255,.22), rgba(20,241,149,.12) 70%, transparent);
  border: 1px solid rgba(153,69,255,.35);
  display: grid; gap: 12px; justify-items: start;
}
.rw-hero .rw-badge {
  font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(20,241,149,.18); color: #88f3c3; border: 1px solid rgba(20,241,149,.4);
}
.rw-hero h2 {
  margin: 0; font-size: clamp(28px, 4vw, 42px); font-weight: 800; letter-spacing: -.02em; line-height: 1.05;
  background: linear-gradient(180deg, #fff, #c8c1ff 55%, #9be9c8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.rw-hero h2 .pct { -webkit-text-fill-color: #14f195; }
.rw-hero p { margin: 0; color: var(--muted); max-width: 62ch; font-size: 14px; }

.rw-link-card {
  display: grid; gap: 10px;
  padding: 16px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
}
.rw-link-card .lbl { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.rw-link-row { display: flex; gap: 8px; flex-wrap: wrap; }
.rw-link-input {
  flex: 1; min-width: 220px;
  background: var(--bg-0); border: 1px solid var(--stroke); border-radius: 9px;
  color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
  padding: 10px 12px;
}
.rw-btn {
  appearance: none; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 700;
  padding: 10px 16px; border-radius: 9px; white-space: nowrap; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid transparent; transition: filter .12s, transform .1s;
}
.rw-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }
.rw-btn.primary { background: linear-gradient(135deg, #c4b1ff, #9be9c8); color: #0c0a1e; }
.rw-btn.ghost { background: var(--surface-2); border-color: var(--stroke); color: var(--text); }
.rw-btn.x { background: #111; border-color: var(--stroke-strong); color: #fff; }

.rw-stats {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
}
.rw-stat {
  padding: 16px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
  display: grid; gap: 3px;
}
.rw-stat .k { font-size: 10.5px; font-weight: 600; color: var(--muted-2); text-transform: uppercase; letter-spacing: .07em; }
.rw-stat .v { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); }
.rw-stat .v.green { color: #14f195; }
.rw-stat .sub { font-size: 11px; color: var(--muted); }

.rw-steps {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.rw-step {
  padding: 18px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
  display: grid; gap: 6px;
}
.rw-step .n {
  width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center; font-weight: 800; font-size: 14px;
  background: linear-gradient(135deg, #9945ff, #14f195); color: #0c0a1e;
}
.rw-step h4 { margin: 4px 0 0; font-size: 14px; }
.rw-step p { margin: 0; font-size: 12.5px; color: var(--muted); }

.rw-section-title { margin: 6px 0 0; font-size: 16px; font-weight: 700; }

.rw-table-wrap {
  border-radius: 14px; border: 1px solid var(--stroke); overflow: hidden;
  background: var(--surface);
}
.rw-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.rw-table th {
  text-align: left; padding: 10px 14px; font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--muted-2); font-weight: 600;
  border-bottom: 1px solid var(--stroke); background: var(--surface-2);
}
.rw-table td { padding: 11px 14px; border-bottom: 1px solid var(--stroke); color: var(--text); }
.rw-table tr:last-child td { border-bottom: 0; }
.rw-table th.num, .rw-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.rw-pill {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
}
.rw-pill.active { background: rgba(20,241,149,.16); color: #88f3c3; border: 1px solid rgba(20,241,149,.35); }
.rw-pill.pending { background: rgba(255,179,71,.16); color: #ffce91; border: 1px solid rgba(255,179,71,.35); }
.rw-empty { padding: 32px 18px; text-align: center; color: var(--muted-2); font-size: 13px; }

.rw-payout {
  display: grid; gap: 12px;
  padding: 18px; border-radius: 14px;
  background: linear-gradient(135deg, rgba(20,241,149,.08), transparent);
  border: 1px solid rgba(20,241,149,.3);
}
.rw-payout-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.rw-payout input {
  flex: 1; min-width: 220px;
  background: var(--bg-0); border: 1px solid var(--stroke); border-radius: 9px;
  color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12.5px; padding: 10px 12px;
}
.rw-fine { font-size: 11px; color: var(--muted-2); line-height: 1.6; }

.rw-ref-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; border-radius: 10px;
  background: rgba(153,69,255,.14); border: 1px solid rgba(153,69,255,.4);
  font-size: 12.5px; color: var(--text);
}

/* Bulk wallet import modal */
.imp-area {
  width: 100%; min-height: 150px; resize: vertical;
  background: var(--bg-0); border: 1px solid var(--stroke); border-radius: 10px;
  color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12px;
  padding: 12px; line-height: 1.5;
}
.imp-area:focus { outline: none; border-color: var(--accent); }
.imp-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.imp-url {
  flex: 1; min-width: 200px;
  background: var(--bg-0); border: 1px solid var(--stroke); border-radius: 9px;
  color: var(--text); font-size: 12.5px; padding: 9px 11px;
}
.imp-url:focus { outline: none; border-color: var(--accent); }
.imp-count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.imp-count strong { color: #14f195; }
.imp-steps { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 0; padding-left: 18px; }
.imp-steps a { color: #88aafc; }

/* Top-holder buy/sell flow tracker (token page → Holders tab) */
.hf-head {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 8px; margin-bottom: 10px; font-size: 12.5px;
}
.hf-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hf-stat {
  font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
  font-variant-numeric: tabular-nums;
}
.hf-stat.buy  { color: #14f195; background: rgba(20,241,149,.13); }
.hf-stat.sell { color: #ff5a76; background: rgba(255,90,118,.13); }
.hf-stat.new  { color: #88aafc; background: rgba(136,170,252,.13); }
.hflow { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hflow em { font-style: normal; opacity: .65; font-weight: 500; }
.hflow.buy  { color: #14f195; }
.hflow.sell { color: #ff5a76; }
.hflow.new  { color: #88aafc; background: rgba(136,170,252,.13); padding: 2px 7px; border-radius: 5px; font-size: 11px; }
.hflow.flat { color: var(--muted-2); }
tr.hf-moved td { background: rgba(255,255,255,.022); }
.hf-toggle { display: inline-flex; gap: 4px; margin-left: 8px; vertical-align: middle; }
.hf-top-btn {
  font: inherit; font-size: 11px; font-weight: 600; cursor: pointer;
  padding: 2px 8px; border-radius: 999px;
  color: var(--muted); background: transparent;
  border: 1px solid var(--stroke);
}
.hf-top-btn:hover:not(.active):not(:disabled) { color: var(--text); border-color: var(--muted-2); }
.hf-top-btn.active { color: #0a0e1a; background: #14f195; border-color: #14f195; }
.hf-top-btn:disabled { opacity: .35; cursor: not-allowed; }

.watchlist-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
}
.wl-card {
  padding: 18px; display: grid; gap: 8px;
  border-radius: 14px; background: var(--surface); border: 1px solid var(--stroke);
  transition: transform .15s, border-color .15s;
}
.wl-card:hover { transform: translateY(-2px); border-color: var(--stroke-strong); }
.wl-card .top { display: flex; align-items: center; gap: 10px; }
.wl-card .av {
  width: 36px; height: 36px; border-radius: 10px;
  background: conic-gradient(from 180deg, #9945ff, #14f195, #4f8bff, #9945ff);
  flex-shrink: 0;
}
.wl-card .label { font-weight: 600; font-size: 14px; }
.wl-card .addr { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--muted); }
.wl-card .stats { display: flex; gap: 10px; flex-wrap: wrap; }
.wl-card .stats > div { flex: 1; }
.wl-card .stats .lbl { font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.wl-card .stats .v   { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wl-card .acts { display: flex; gap: 6px; }

/* Pricing */
.pricing-hero {
  padding: 36px clamp(20px, 4vw, 48px);
  text-align: center;
  display: grid; gap: 14px; justify-items: center;
}
.pricing-hero h2 {
  margin: 0; font-size: clamp(32px, 4.5vw, 48px); letter-spacing: -.025em; font-weight: 800; line-height: 1.05;
  background: linear-gradient(180deg, #ffffff, #c8c1ff 60%, #9be9c8);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.pricing-hero p { margin: 0; color: var(--muted); max-width: 60ch; font-size: 14.5px; }
.billing-toggle {
  display: inline-flex; gap: 4px; padding: 4px;
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 999px;
  margin-top: 8px;
}
.billing-toggle button {
  appearance: none; border: 0; background: transparent; color: var(--muted);
  padding: 8px 16px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 500;
  transition: color .15s, background .15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.billing-toggle button.active {
  color: #0c0a1e;
  background: linear-gradient(135deg, #c4b1ff, #9be9c8);
  box-shadow: 0 6px 20px -10px rgba(153, 69, 255, .8);
}
.billing-toggle .save-pill {
  font-size: 9.5px; padding: 2px 6px; border-radius: 999px; letter-spacing: .06em;
  background: rgba(20, 241, 149, .25); color: #88f3c3;
  border: 1px solid rgba(20, 241, 149, .4);
}
.billing-toggle button.active .save-pill {
  background: rgba(255, 255, 255, .15); color: #0c0a1e; border-color: rgba(0,0,0,.15);
}

.tier-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  align-items: stretch;
}
.tier {
  position: relative;
  padding: 24px;
  display: flex; flex-direction: column; gap: 14px;
  background: var(--surface);
  border: 1px solid var(--stroke); border-radius: 18px;
  transition: transform .2s, border-color .2s;
}
.tier:hover { transform: translateY(-3px); border-color: var(--stroke-strong); }
.tier.featured {
  background: linear-gradient(180deg, rgba(153,69,255,.14), rgba(20,241,149,.06) 80%, transparent);
  border-color: rgba(153, 69, 255, .45);
  box-shadow: 0 30px 80px -30px rgba(153, 69, 255, .6);
}
.tier.featured::before {
  content: 'Most popular';
  position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
  padding: 4px 12px; border-radius: 999px;
  background: linear-gradient(135deg, #c4b1ff, #9be9c8);
  color: #0c0a1e; font-size: 10.5px; letter-spacing: .12em; font-weight: 700; text-transform: uppercase;
}
.tier-name {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 600; color: var(--text); letter-spacing: .04em;
}
.tier-name .badge {
  font-size: 9.5px; padding: 2px 7px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--stroke);
  color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-weight: 600;
}
.tier-tagline { color: var(--muted); font-size: 12.5px; line-height: 1.5; }
.tier-price { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
.tier-price .num { font-size: 38px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.tier-price .num.custom { font-size: 26px; }
.tier-price .per { font-size: 12.5px; color: var(--muted); }
.tier-price .strike { color: var(--muted); text-decoration: line-through; font-size: 14px; }
.tier-features {
  list-style: none; margin: 0; padding: 0; display: grid; gap: 6px;
  font-size: 13px;
}
.tier-features li {
  display: grid; grid-template-columns: 18px 1fr; gap: 8px;
  align-items: flex-start;
  color: var(--text);
}
.tier-features li::before {
  content: ''; display: block; width: 16px; height: 16px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2388f3c3'><path d='M9 16.17L4.83 12l-1.42 1.41L9 19l12-12l-1.41-1.41z'/></svg>");
  background-repeat: no-repeat; background-size: contain;
}
.tier-features li.muted { color: var(--muted); }
.tier-features li.muted::before {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236a6790'><path d='M19 13H5v-2h14z'/></svg>");
}
.tier-cta {
  margin-top: auto; padding: 12px 14px; border-radius: 12px;
  font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
  text-align: center; text-decoration: none;
  display: block;
}
.tier-cta.primary {
  color: #0a0820;
  background: linear-gradient(135deg, #c4b1ff, #9be9c8);
  border: 0;
  box-shadow: 0 14px 30px -14px rgba(153, 69, 255, .7);
}
.tier-cta.secondary {
  background: transparent; color: var(--text);
  border: 1px solid var(--stroke-strong);
}
.tier-cta:hover { transform: translateY(-1px); }
.tier-cta.current {
  background: rgba(20, 241, 149, .15); color: #88f3c3;
  border: 1px solid rgba(20, 241, 149, .35);
}

.compare-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.compare-table thead th {
  padding: 14px 12px; text-align: left;
  border-bottom: 1px solid var(--stroke);
  font-size: 12px; font-weight: 600; color: var(--text);
}
.compare-table thead th.center { text-align: center; font-weight: 600; }
.compare-table tbody td {
  padding: 11px 12px; border-bottom: 1px solid var(--stroke);
  vertical-align: middle;
}
.compare-table tbody td:first-child { color: var(--muted); }
.compare-table tbody td.center { text-align: center; }
.compare-table tbody tr:last-child td { border-bottom: 0; }
.compare-check { color: var(--pos); font-size: 14px; }
.compare-dash  { color: var(--muted-2); }

.faq { display: grid; gap: 10px; }
.faq details {
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 12px;
  padding: 14px 16px; transition: background .15s;
}
.faq details[open] { background: var(--surface-2); }
.faq summary {
  cursor: pointer; font-weight: 600; font-size: 14px;
  display: flex; justify-content: space-between; align-items: center;
  list-style: none;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; color: var(--muted); font-size: 18px; transition: transform .15s; }
.faq details[open] summary::after { content: '−'; }
.faq p { margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

.tier-pill-mini {
  display: inline-flex; align-items: center;
  padding: 1px 7px; border-radius: 999px;
  background: linear-gradient(135deg, rgba(153,69,255,.35), rgba(20,241,149,.25));
  border: 1px solid rgba(153,69,255,.45);
  color: #d8c9ff; font-size: 9.5px; letter-spacing: .08em;
  text-transform: uppercase; font-weight: 700; margin-left: 6px;
}
.tier-pill-mini.trial {
  background: linear-gradient(135deg, rgba(20,241,149,.35), rgba(153,69,255,.15));
  border-color: rgba(20,241,149,.5);
  color: #b9f7d8;
}

/* Trial banner used on the pricing page (and any future surfaces) */
.trial-banner {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; border-radius: 14px;
  background: linear-gradient(135deg, rgba(20,241,149,.18), rgba(153,69,255,.18));
  border: 1px solid rgba(20,241,149,.4);
  color: var(--text); font-size: 13.5px;
  margin-bottom: -6px;
}
.trial-banner .pulse {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--pos); box-shadow: 0 0 12px var(--pos);
  animation: pulse-dot 1.6s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.25); opacity: .65; }
}
.trial-banner strong { color: var(--text); }
.trial-banner .countdown {
  margin-left: auto; font-family: 'JetBrains Mono', monospace;
  font-variant-numeric: tabular-nums; font-size: 12.5px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.12);
}

/* Docs */
.docs-layout {
  display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px;
}
@media (max-width: 880px) { .docs-layout { grid-template-columns: 1fr; } }
.docs-sidebar {
  position: sticky; top: 130px;
  align-self: start;
  max-height: calc(100vh - 150px); overflow-y: auto;
  padding: 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
}
.docs-sidebar h5 {
  margin: 14px 6px 6px;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted-2); font-weight: 600;
}
.docs-sidebar h5:first-child { margin-top: 4px; }
.docs-sidebar a {
  display: block; padding: 7px 10px; border-radius: 8px;
  font-size: 13px; color: var(--muted); text-decoration: none;
  transition: color .15s, background .15s;
}
.docs-sidebar a:hover { color: var(--text); background: var(--surface-2); }
.docs-sidebar a.active {
  color: var(--text);
  background: rgba(153,69,255,.14);
  box-shadow: inset 0 0 0 1px rgba(153,69,255,.3);
}
.docs-content { display: grid; gap: 18px; }
.docs-content .card { padding: 28px; }
.docs-content h2 { margin: 0; font-size: clamp(24px, 3vw, 30px); font-weight: 800; letter-spacing: -.02em; }
.docs-content h3 { margin: 22px 0 6px; font-size: 17px; font-weight: 600; }
.docs-content h4 { margin: 18px 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.docs-content p, .docs-content li { color: var(--muted); line-height: 1.65; }
.docs-content p { max-width: 70ch; margin: 8px 0; font-size: 14px; }
.docs-content ul, .docs-content ol { padding-left: 22px; max-width: 70ch; font-size: 14px; }
.docs-content ul li, .docs-content ol li { margin: 4px 0; }
.docs-content strong { color: var(--text); font-weight: 600; }
.docs-content a:not(.docs-pill):not(.docs-nav-btn) {
  color: #c8c1ff; text-decoration: none; border-bottom: 1px solid rgba(200,193,255,.3);
}
.docs-content a:not(.docs-pill):not(.docs-nav-btn):hover { color: #fff; border-color: currentColor; }
.docs-content code:not(.code-block) {
  background: var(--surface-2); padding: 1px 7px; border-radius: 5px;
  font-size: 11.5px; border: 1px solid var(--stroke);
  color: #c8c1ff; font-family: 'JetBrains Mono', monospace;
}
.docs-content table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
.docs-content table th, .docs-content table td {
  padding: 8px 12px; border-bottom: 1px solid var(--stroke); text-align: left;
}
.docs-content table th { color: var(--muted); font-weight: 500; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.docs-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(153, 69, 255, .15); color: #d8c9ff;
  border: 1px solid rgba(153, 69, 255, .3);
  font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
  font-weight: 600; text-decoration: none !important;
}
.docs-nav {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;
}
@media (max-width: 600px) { .docs-nav { grid-template-columns: 1fr; } }
.docs-nav-btn {
  padding: 14px 16px; border-radius: 12px; border: 1px solid var(--stroke);
  background: var(--surface); text-decoration: none !important; color: var(--text);
  display: grid; gap: 4px;
  transition: background .15s, border-color .15s, transform .15s;
}
.docs-nav-btn:hover { background: var(--surface-2); border-color: var(--stroke-strong); transform: translateY(-1px); }
.docs-nav-btn .dir { font-size: 11px; color: var(--muted); }
.docs-nav-btn .ttl { font-weight: 600; font-size: 14px; }
.docs-nav-btn.next { text-align: right; }
.docs-callout {
  padding: 14px 16px; margin: 14px 0;
  background: rgba(153, 69, 255, .08); border: 1px solid rgba(153, 69, 255, .25);
  border-radius: 10px; font-size: 13px; color: var(--text);
}
.docs-callout.warn { background: rgba(255, 179, 71, .08); border-color: rgba(255, 179, 71, .3); }
.docs-callout.success { background: rgba(20, 241, 149, .08); border-color: rgba(20, 241, 149, .3); }
.docs-callout strong { display: block; margin-bottom: 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Providers / settings page */
.provider-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
}
.prov-card {
  display: grid; gap: 10px;
  padding: 18px;
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 14px;
}
.prov-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.prov-title { font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.prov-pill {
  font-size: 9.5px; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--stroke);
  color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
}
.prov-pill.pill-on {
  background: rgba(20, 241, 149, .18); color: #88f3c3;
  border-color: rgba(20, 241, 149, .35);
}
.prov-tags { display: grid; gap: 4px; }
.prov-tag { font-size: 12px; line-height: 1.45; }
.prov-tag.pos   { color: #b9f7d8; }
.prov-tag.muted { color: var(--muted); }
.prov-steps {
  margin: 0; padding: 0; list-style: none; display: grid; gap: 4px;
  font-size: 12px; color: var(--muted); line-height: 1.5;
}
.prov-steps strong { color: var(--text); margin-right: 4px; }
.prov-form { display: grid; gap: 8px; padding-top: 6px; border-top: 1px solid var(--stroke); }
.prov-input {
  appearance: none; background: var(--surface-2); color: var(--text);
  border: 1px solid var(--stroke); font: inherit; font-family: 'JetBrains Mono', monospace;
  font-size: 12px; padding: 10px 12px; border-radius: 10px; outline: none;
}
.prov-input:focus { border-color: rgba(153, 69, 255, .55); box-shadow: 0 0 0 3px rgba(153, 69, 255, .15); }
.prov-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.prov-status { min-height: 16px; }
.prov-status .pos { color: var(--pos); }
.prov-status .neg { color: var(--neg); }

.rpc-chain {
  margin: 0; padding: 0; list-style: none; display: grid; gap: 6px;
  font-size: 12px;
}
.rpc-chain li {
  display: flex; gap: 10px; align-items: center;
  padding: 8px 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--stroke);
}
.rpc-chain .rpc-i { color: var(--muted-2); font-variant-numeric: tabular-nums; min-width: 22px; }

/* Status page */
.status-grid {
  display: grid; gap: 10px;
}
.status-row {
  display: grid; grid-template-columns: 36px minmax(0, 1.2fr) minmax(0, 2fr) auto;
  gap: 14px; align-items: center;
  padding: 14px 16px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--stroke);
}
.status-dot {
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--muted); box-shadow: 0 0 8px var(--muted);
}
.status-dot.ok  { background: var(--pos); box-shadow: 0 0 8px var(--pos); }
.status-dot.bad { background: var(--neg); box-shadow: 0 0 8px var(--neg); }
.status-row .name { font-weight: 600; font-size: 13.5px; }
.status-row .url  { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); word-break: break-all; }
.status-row .right { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; }

/* Command palette */
.palette {
  position: fixed; inset: 0; z-index: 200;
  padding: 8vh 4vw 0;
  display: flex; justify-content: center; align-items: flex-start;
}
.palette[hidden] { display: none; }
.palette-backdrop {
  position: absolute; inset: 0;
  background: rgba(5, 4, 12, .55);
  backdrop-filter: blur(8px);
  animation: fade-in .15s ease-out;
}
.palette-panel {
  position: relative;
  width: min(720px, 100%);
  max-height: 76vh;
  display: flex; flex-direction: column;
  background: rgba(13, 11, 29, .98);
  border: 1px solid var(--stroke-strong);
  border-radius: 16px;
  box-shadow: 0 40px 100px -20px rgba(0,0,0,.7);
  animation: pop-in .18s ease-out;
  overflow: hidden;
}
.palette-head {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--stroke);
}
.palette-ico { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
.palette-head input {
  flex: 1; min-width: 0;
  appearance: none; border: 0; background: transparent;
  color: var(--text); font: inherit; font-size: 16px;
  padding: 6px 0; outline: none;
}
.palette-head input::placeholder { color: var(--muted-2); }
.palette-esc, .palette-foot kbd {
  display: inline-flex; align-items: center; padding: 2px 7px;
  font-size: 10px; font-family: 'JetBrains Mono', monospace;
  background: var(--surface-2); border: 1px solid var(--stroke);
  border-radius: 5px; color: var(--muted); letter-spacing: .04em;
}
.palette-body {
  overflow-y: auto; padding: 6px 6px 8px; flex: 1;
}
.palette-section-title {
  padding: 12px 14px 6px;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted-2); font-weight: 600;
}
.palette-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 10px;
  cursor: pointer; user-select: none;
}
.palette-row:hover, .palette-row.active {
  background: rgba(153, 69, 255, .14);
  box-shadow: inset 0 0 0 1px rgba(153, 69, 255, .3);
}
.palette-row .ico {
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--stroke);
  color: #c8c1ff; flex-shrink: 0;
}
.palette-row img.ico {
  background: var(--surface-2);
}
.palette-row .meta { flex: 1; min-width: 0; }
.palette-row .ttl { font-size: 13.5px; font-weight: 500; }
.palette-row .sub { font-size: 11px; color: var(--muted); margin-top: 1px; font-family: 'JetBrains Mono', monospace; }
.palette-row .chev { color: var(--muted); font-size: 11px; }
.palette-empty { padding: 36px; text-align: center; color: var(--muted); font-size: 13px; }
.palette-foot {
  display: flex; gap: 14px; padding: 8px 14px;
  border-top: 1px solid var(--stroke);
  font-size: 11px; color: var(--muted);
}
.palette-foot span { display: inline-flex; align-items: center; gap: 4px; }

.search-hint {
  font-size: 10px; padding: 2px 6px; border-radius: 5px;
  background: var(--surface-2); border: 1px solid var(--stroke);
  color: var(--muted); font-family: 'JetBrains Mono', monospace;
  margin-right: 4px;
}

/* Toast */
.toast-container {
  position: fixed; bottom: 16px; right: 16px; z-index: 150;
  display: grid; gap: 8px; max-width: 360px;
}
.toast {
  padding: 12px 14px; border-radius: 12px;
  background: rgba(13, 11, 29, .96);
  border: 1px solid var(--stroke-strong);
  box-shadow: 0 18px 50px -20px rgba(0,0,0,.7);
  font-size: 13px; color: var(--text);
  display: flex; gap: 10px; align-items: flex-start;
  animation: toast-in .25s ease-out;
}
.toast .ico { font-size: 16px; line-height: 1; }
.toast .body { flex: 1; min-width: 0; }
.toast .body .ttl { font-weight: 600; }
.toast .body .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
.toast .close { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Modal */
.modal {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 5vh 4vw;
}
.modal[hidden] { display: none; }
.modal-backdrop {
  position: absolute; inset: 0;
  background: rgba(5, 4, 12, .65);
  backdrop-filter: blur(8px);
  animation: fade-in .18s ease-out;
}
.modal-panel {
  position: relative;
  width: min(960px, 100%); max-height: 90vh;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, rgba(20, 17, 40, .98), rgba(13, 11, 29, .98));
  border: 1px solid var(--stroke-strong);
  border-radius: 18px;
  box-shadow: 0 40px 100px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
  overflow: hidden;
  animation: pop-in .2s ease-out;
}
@keyframes fade-in { from { opacity: 0 } to { opacity: 1 } }
@keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(.98) } to { opacity: 1; transform: translateY(0) scale(1) } }
.modal-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--stroke);
}
.modal-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
.modal-head p { margin: 4px 0 0; }
.modal-body {
  overflow: auto; padding: 14px 14px 18px;
}
.modal-body .empty, .modal-body .modal-loading {
  padding: 40px; text-align: center; color: var(--muted);
}
.modal-loading::before {
  content: ""; display: block; width: 22px; height: 22px; margin: 0 auto 12px;
  border-radius: 50%; border: 2px solid rgba(255,255,255,.15); border-top-color: var(--text);
  animation: spin .9s linear infinite;
}
.modal-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
.modal-table thead th {
  text-align: left; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted); font-weight: 500; padding: 6px 12px;
}
.modal-table tbody td {
  padding: 12px; background: var(--surface); border-top: 1px solid var(--stroke); border-bottom: 1px solid var(--stroke);
  font-size: 13px; vertical-align: middle;
}
.modal-table tbody tr td:first-child { border-left: 1px solid var(--stroke); border-radius: 10px 0 0 10px; }
.modal-table tbody tr td:last-child  { border-right: 1px solid var(--stroke); border-radius: 0 10px 10px 0; }
.modal-table tbody tr:hover td { background: var(--surface-2); }
.modal-table .num { text-align: right; font-variant-numeric: tabular-nums; }
.modal-table a.ext { color: #c8c1ff; text-decoration: none; font-size: 11px; }
.modal-table a.ext:hover { color: var(--text); text-decoration: underline; }
.rank-cell { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; width: 32px; }

/* Holdings rows clickable */
.holding-row { cursor: pointer; }
.ticker-item[data-mint] { cursor: pointer; }
.ticker-item[data-mint]:hover { color: #fff; }

/* Token detail */
.td-summary {
  display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 14px 12px; background: var(--surface); border: 1px solid var(--stroke);
  border-radius: 12px; margin-bottom: 14px;
}
.td-id { display: flex; align-items: center; gap: 14px; }
.td-logo { width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2); }
.td-price { font-size: 26px; font-weight: 800; letter-spacing: -.01em; }
.td-chg { font-size: 13px; margin-top: 2px; }
.td-links { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.td-h4 { margin: 14px 12px 8px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Token Checker */
.checker { padding: 4px; }
.checker-score {
  display: flex; align-items: center; gap: 16px;
  padding: 14px 16px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--stroke);
  margin-bottom: 14px;
}
.grade {
  width: 56px; height: 56px; border-radius: 14px;
  display: grid; place-content: center; font-size: 28px; font-weight: 800;
  background: rgba(153, 69, 255, .18); color: #d8c9ff; border: 1px solid rgba(153, 69, 255, .35);
}
.grade.pos { background: rgba(20, 241, 149, .18); color: #88f3c3; border-color: rgba(20, 241, 149, .35); }
.grade.neg { background: rgba(255, 90, 118, .18); color: #ffb0bd; border-color: rgba(255, 90, 118, .35); }
.checker-flags {
  list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px;
}
.checker-flags li {
  padding: 10px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--stroke); font-size: 13px;
}
.checker-flags li.good { color: #a3f3c8; border-color: rgba(20, 241, 149, .25); background: rgba(20, 241, 149, .06); }
.checker-flags li.warn { color: #ffce91; border-color: rgba(255, 179, 71, .3); background: rgba(255, 179, 71, .06); }

/* Decoder */
.ix-list, .bal-list {
  margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 6px;
}
.ix-list li, .bal-list li {
  padding: 10px 12px; background: var(--surface); border: 1px solid var(--stroke);
  border-radius: 10px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 12px;
}
.ix-type {

  color: #ffc251; border: 1px solid rgba(255,176,32,.4); vertical-align: 1px; }

</style>

<body>
  <div class="aurora">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <header class="topbar">
    <div class="topbar-main">
      <a class="brand" href="#/wallet">
        <span class="logo-mark">
          <svg viewBox="0 0 32 32" aria-hidden="true">

              </linearGradient>
              <linearGradient id="lg2" x1="1" x2="0" y1="0" y2="1">
                <stop offset="0%" stop-color="#6fd6ff"/>
                <stop offset="100%" stop-color="#4DA2FF"/>
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="30" height="30" rx="9" fill="#0d0b1d" stroke="url(#lg)" stroke-width="1.2"/>
            <path d="M16 6 C 11 11, 9 15, 9 19 a7 7 0 0 0 14 0 c 0-4 -2-8 -7-13 Z"
                  fill="url(#lg)" opacity=".92"/>
            <circle cx="16" cy="19" r="3.4" fill="#0d0b1d" opacity=".55"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>SuiSun</h1>
          <p class="brand-sub">Sui intelligence</p>
        </div>
      </a>

      <nav class="primary-nav" aria-label="Primary">
        <a class="nav-link" href="#/wallet" data-route="wallet"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 18v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1h-9a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2zm-9-2h10V8H12zm4-2.5a1.5 1.5 0 1 1 1.5-1.5a1.5 1.5 0 0 1-1.5 1.5"/></svg>Wallet Tracker</a>
        <a class="nav-link" href="#/watchlist" data-route="watchlist"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2L9.19 8.63L2 9.24l5.46 4.73L5.82 21z"/></svg>My Watchlist</a>

      <div class="topbar-right">

          <input id="address" type="text" placeholder="Paste a Sui wallet address (0x…)" spellcheck="false" required />
          <button type="button" id="paste-btn" class="ghost-btn small">Paste</button>
          <button type="submit" class="primary-btn small">Track</button>
        </form>
      </div>

  </header>

  <main class="container">
    <section id="page-view" class="page-view"></section>
  </main>

  <div id="toast-host" aria-live="polite"></div>

  <script>
  'use strict';
  /* ====================================================================
   *  SuiSun — Sui wallet tracker. Single-file, no backend.
   *  State lives in localStorage under suiscope:* keys.
   * ==================================================================== */
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const MIST_PER_SUI = 1e9;
  const SUI_TYPE = '0x2::sui::SUI';

  /* ---------- formatting helpers ---------- */
  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  function shorten(a, l = 6, r = 6) {
    a = String(a || '');
    return a.length <= l + r + 1 ? a : a.slice(0, l) + '…' + a.slice(-r);
  }
  function fmt(n) {
    n = Number(n) || 0;
    return n.toLocaleString('en-US', { maximumFractionDigits: n !== 0 && Math.abs(n) < 1 ? 6 : 2 });
  }
  function fmtUSD(n, d = 2) {
    n = Number(n) || 0;
    return '$' + n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function timeAgo(sec) {
    const d = Math.floor(Date.now() / 1000) - Math.floor(sec);
    if (d < 60) return d + 's ago';
    if (d < 3600) return Math.floor(d / 60) + 'm ago';
    if (d < 86400) return Math.floor(d / 3600) + 'h ago';
    return Math.floor(d / 86400) + 'd ago';
  }
  function safeUrl(u) {
    const s = String(u ?? '').trim();
    return /^https?:\/\//i.test(s) ? escapeHtml(s) : '';
  }

  /* ---------- Sui address handling ---------- */
  function normalizeSuiAddress(a) {
    a = String(a || '').trim().toLowerCase();
    if (!/^0x[0-9a-f]+$/.test(a)) return a;
    return '0x' + a.slice(2).padStart(64, '0');
  }
  function isValidSuiAddress(a) {
    a = String(a || '').trim().toLowerCase();
    return /^0x[0-9a-f]{1,64}$/.test(a) && a.length > 3;
  }

  /* ---------- toast ---------- */
  function toast({ title, sub, icon = '•', timeout = 4000, onClick } = {}) {
    const host = $('#toast-host');
    if (!host) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<span class="toast-ico">${escapeHtml(icon)}</span>
      <div class="toast-text"><div class="toast-title">${escapeHtml(title || '')}</div>
      ${sub ? `<div class="toast-sub">${escapeHtml(sub)}</div>` : ''}</div>`;
    if (onClick) { el.style.cursor = 'pointer'; el.addEventListener('click', onClick); }
    host.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, timeout);
  }

  /* ---------- Sui JSON-RPC ---------- */
  const SUI_RPCS = [
    'https://fullnode.mainnet.sui.io:443',
    'https://sui-rpc.publicnode.com',
    'https://sui-mainnet.public.blastapi.io',
  ];
  let _rpcIdx = 0;
  async function suiRpc(method, params = []) {
    let lastErr;
    for (let i = 0; i < SUI_RPCS.length; i++) {
      const idx = (_rpcIdx + i) % SUI_RPCS.length;
      try {
        const r = await fetch(SUI_RPCS[idx], {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }),
        });
        if (!r.ok) { lastErr = new Error('HTTP ' + r.status); continue; }
        const j = await r.json();
        if (j.error) { lastErr = new Error(j.error.message || 'RPC error'); continue; }
        _rpcIdx = idx;
        return j.result;
      } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('All Sui RPC endpoints failed');
  }

  /* ---------- coin metadata (cached) ---------- */
  const _metaCache = new Map();
  async function coinMeta(coinType) {
    if (_metaCache.has(coinType)) return _metaCache.get(coinType);
    let m = null;
    try { m = await suiRpc('suix_getCoinMetadata', [coinType]); } catch (_) {}
    _metaCache.set(coinType, m);
    return m;
  }

  /* ---------- DexScreener prices (Sui) — best-effort ---------- */
  async function fetchSuiPrices(coinTypes) {
    const out = new Map();
    if (!coinTypes.length) return out;
    const chunks = [];
    for (let i = 0; i < coinTypes.length; i += 30) chunks.push(coinTypes.slice(i, i + 30));
    await Promise.all(chunks.map(async chunk => {
      try {
        const r = await fetch('https://api.dexscreener.com/latest/dex/tokens/'
          + chunk.map(encodeURIComponent).join(','));
        if (!r.ok) return;
        const j = await r.json();
        for (const p of (j?.pairs || [])) {
          if (p.chainId !== 'sui') continue;
          const addr = p.baseToken?.address;
          const px = Number(p.priceUsd) || 0;
          if (!addr || !px) continue;
          const prev = out.get(addr);
          if (!prev || px > 0) out.set(addr, { price: px, change24h: Number(p.priceChange?.h24 ?? 0) });
        }
      } catch (_) {}
    }));
    return out;
  }

  /* ---------- wallet fetch ---------- */
  async function fetchWallet(address) {
    const addr = normalizeSuiAddress(address);
    const balances = await suiRpc('suix_getAllBalances', [addr]) || [];
    const metas = await Promise.all(balances.map(b => coinMeta(b.coinType)));
    const coins = balances.map((b, i) => {
      const m = metas[i] || {};
      const decimals = m.decimals ?? (b.coinType === SUI_TYPE ? 9 : 0);
      return {
        coinType: b.coinType,
        symbol: m.symbol || b.coinType.split('::').pop() || '?',
        name: m.name || '',
        icon: m.iconUrl || null,
        decimals,
        amount: Number(b.totalBalance || 0) / Math.pow(10, decimals),
        objectCount: b.coinObjectCount || 0,
      };
    }).filter(c => c.amount > 0);
    const sui = coins.find(c => c.coinType === SUI_TYPE);
    coins.sort((a, b) => b.amount - a.amount);
    return { address: addr, sui: sui ? sui.amount : 0, coins };
  }

  /* ---------- watchlist store ---------- */
  const watchlist = {
    KEY: 'suiscope:watchlist',
    list() { try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); } catch { return []; } },
    save(v) { localStorage.setItem(this.KEY, JSON.stringify(v)); },
    has(a) { a = normalizeSuiAddress(a); return this.list().some(w => w.address === a); },
    add(address, label) {
      const a = normalizeSuiAddress(address);
      const v = this.list();
      if (v.some(w => w.address === a)) return false;
      v.unshift({ address: a, label: (label || '').trim() || shorten(a, 6, 6), addedAt: Date.now() });
      this.save(v);
      return true;
    },
    remove(a) { a = normalizeSuiAddress(a); this.save(this.list().filter(w => w.address !== a)); },
    rename(a, label) {
      a = normalizeSuiAddress(a);
      const v = this.list();
      const w = v.find(x => x.address === a);
      if (w && label.trim()) { w.label = label.trim(); this.save(v); }
    },
  };

  const SUIVISION = 'https://suivision.xyz';

  /* ---------- shared page chrome ---------- */
  function pageHeader({ title, sub, actions = '' }) {
    return `<div class="page-head">
      <div><h2 class="page-title">${escapeHtml(title)}</h2>
      ${sub ? `<p class="page-sub">${escapeHtml(sub)}</p>` : ''}</div>
      ${actions ? `<div class="page-actions">${actions}</div>` : ''}
    </div>`;
  }
  function render(html) { $('#page-view').innerHTML = html; }

  /* ====================================================================
   *  Wallet Tracker page
   * ==================================================================== */
  let trackedAddress = '';

  function renderTrackerPage() {
    render(`
      ${pageHeader({
        title: 'Wallet Tracker',
        sub: 'Paste any Sui wallet address to see its SUI balance and coin holdings, valued live.',
      })}
      <div class="card glass">
        <form id="track-form" class="prompt-form" style="display:flex;gap:8px">
          <input id="track-input" class="filter-input" placeholder="0x… Sui wallet address"
            style="flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:13px;padding:12px 14px"
            value="${escapeHtml(trackedAddress)}" autofocus />
          <button class="primary-btn small" type="submit">Track →</button>
        </form>
      </div>
      <div id="tracker-result"></div>
    `);
    $('#track-form').addEventListener('submit', e => {
      e.preventDefault();
      const v = $('#track-input').value.trim();
      if (v) trackAddress(v);
    });
    if (trackedAddress) loadTracker(trackedAddress);
  }

  async function trackAddress(address) {
    if (!isValidSuiAddress(address)) {
      toast({ title: 'Invalid Sui address', sub: 'Expected 0x followed by hex characters.', icon: '!' });
      return;
    }
    trackedAddress = normalizeSuiAddress(address);
    if (location.hash !== '#/wallet') { location.hash = '#/wallet'; }
    else renderTrackerPage();
  }

  async function loadTracker(address) {
    const out = $('#tracker-result');
    if (!out) return;
    out.innerHTML = `<div class="status loading">Loading wallet from the Sui network…</div>`;
    let data;
    try {
      data = await fetchWallet(address);
    } catch (err) {
      out.innerHTML = `<div class="status error">Couldn't load wallet: ${escapeHtml(err.message)}</div>`;
      return;
    }
    const onList = watchlist.has(data.address);
    out.innerHTML = `
      <div class="card glass">
        <div class="card-head">
          <h3>${shorten(data.address, 10, 8)}</h3>
          <div class="card-tools">
            <a class="ghost-btn small" target="_blank" rel="noopener" href="${SUIVISION}/account/${escapeHtml(data.address)}">SuiVision ↗</a>
            <button class="ghost-btn small" id="tracker-watch"${onList ? ' disabled' : ''}>${onList ? '✓ On watchlist' : '★ Add to watchlist'}</button>
          </div>
        </div>
        <div class="wl-card" style="border:0;padding:0">
          <div class="stats">
            <div><div class="lbl">SUI Balance</div><div class="v" id="t-sui">${fmt(data.sui)}</div></div>
            <div><div class="lbl">Coins held</div><div class="v">${data.coins.length}</div></div>
            <div><div class="lbl">Total value</div><div class="v" id="t-total">—</div></div>
          </div>
        </div>
      </div>
      <div class="card glass">
        <div class="card-head"><h3>Holdings</h3></div>
        ${data.coins.length ? `
        <table class="modal-table">
          <thead><tr><th>Coin</th><th class="num">Amount</th><th class="num">Price</th><th class="num">Value</th></tr></thead>
          <tbody id="holdings-body">
            ${data.coins.map(c => `
              <tr data-coin="${escapeHtml(c.coinType)}">
                <td>
                  <a class="ext" target="_blank" rel="noopener" href="${SUIVISION}/coin/${encodeURIComponent(c.coinType)}">
                    ${escapeHtml(c.symbol)}${c.name ? ` · ${escapeHtml(c.name)}` : ''} ↗
                  </a>
                </td>
                <td class="num">${fmt(c.amount)}</td>
                <td class="num" data-price>—</td>
                <td class="num" data-value>—</td>
              </tr>`).join('')}
          </tbody>
        </table>` : `<div class="empty">This wallet holds no coins.</div>`}
      </div>
    `;
    $('#tracker-watch')?.addEventListener('click', () => {
      if (watchlist.add(data.address, '')) {
        $('#tracker-watch').disabled = true;
        $('#tracker-watch').textContent = '✓ On watchlist';
        toast({ title: 'Added to watchlist', sub: shorten(data.address, 6, 6), icon: '★' });
      }
    });

    // Best-effort live pricing.
    const prices = await fetchSuiPrices(data.coins.map(c => c.coinType));
    let total = 0;
    for (const c of data.coins) {
      const p = prices.get(c.coinType);
      const row = out.querySelector(`tr[data-coin="${CSS.escape(c.coinType)}"]`);
      if (!row) continue;
      if (p && p.price) {
        const value = c.amount * p.price;
        total += value;
        row.querySelector('[data-price]').textContent = fmtUSD(p.price, p.price < 1 ? 6 : 2);
        row.querySelector('[data-value]').textContent = fmtUSD(value);
      }
    }
    const totalEl = $('#t-total');
    if (totalEl) totalEl.textContent = total > 0 ? fmtUSD(total) : 'n/a';
  }

  /* ====================================================================
   *  Watchlist page
   * ==================================================================== */
  function renderWatchlistPage() {
    const wallets = watchlist.list();
    render(`
      ${pageHeader({
        title: 'My Watchlist',
        sub: 'Saved Sui wallets. Balances refresh each time you open this page.',
        actions: `<button class="ghost-btn small" id="wl-refresh">Refresh</button>`,
      })}
      ${wallets.length ? `
        <div class="watchlist-grid" id="wl-grid">
          ${wallets.map(w => `
            <div class="wl-card" data-addr="${escapeHtml(w.address)}">
              <div class="top">
                <span class="av"></span>
                <div style="flex:1;min-width:0">
                  <div class="label">${escapeHtml(w.label)}</div>
                  <div class="addr">${shorten(w.address, 8, 8)}</div>
                </div>
              </div>
              <div class="stats">
                <div><div class="lbl">SUI</div><div class="v" data-sui>—</div></div>
                <div><div class="lbl">Coins</div><div class="v" data-coins>—</div></div>
                <div><div class="lbl">Saved</div><div class="v" style="font-size:12px;font-weight:500;color:var(--muted)">${timeAgo(Math.floor(w.addedAt / 1000))}</div></div>
              </div>
              <div class="acts">
                <button class="primary-btn small" data-open>Open ↗</button>
                <button class="ghost-btn small" data-rename>Rename</button>
                <button class="ghost-btn small" data-remove>Remove</button>
              </div>
            </div>`).join('')}
        </div>` : `
        <div class="card glass">
          <div class="page-empty">
            <h3>No saved wallets yet</h3>
            <p>Track a wallet, then hit “Add to watchlist” to pin it here.</p>
          </div>
        </div>`}
    `);

    $('#wl-refresh')?.addEventListener('click', loadWatchlistStats);
    $$('#wl-grid .wl-card').forEach(card => {
      const addr = card.dataset.addr;
      $('[data-open]', card).addEventListener('click', () => trackAddress(addr));
      $('[data-rename]', card).addEventListener('click', () => {
        const label = prompt('Label for this wallet:', card.querySelector('.label').textContent);
        if (label && label.trim()) { watchlist.rename(addr, label); renderWatchlistPage(); }
      });
      $('[data-remove]', card).addEventListener('click', () => {
        if (confirm('Remove from watchlist?')) { watchlist.remove(addr); renderWatchlistPage(); }
      });
    });
    loadWatchlistStats();
  }

  async function loadWatchlistStats() {
    for (const w of watchlist.list()) {
      const card = $(`#wl-grid .wl-card[data-addr="${CSS.escape(w.address)}"]`);
      if (!card) continue;
      try {
        const data = await fetchWallet(w.address);
        const suiEl = card.querySelector('[data-sui]');
        const coinsEl = card.querySelector('[data-coins]');
        if (suiEl) suiEl.textContent = fmt(data.sui);
        if (coinsEl) coinsEl.textContent = data.coins.length;
      } catch (_) {
        const suiEl = card.querySelector('[data-sui]');
        if (suiEl) suiEl.textContent = 'err';
      }
    }
  }

  /* ====================================================================
   *  Router
   * ==================================================================== */
  const ROUTES = {
    '/wallet': renderTrackerPage,
    '/watchlist': renderWatchlistPage,
  };
  function route() {
    const hash = location.hash.replace(/^#/, '') || '/wallet';
    const path = hash.split('?')[0];
    const fn = ROUTES[path] || ROUTES['/wallet'];
    $$('.nav-link[data-route]').forEach(a => {
      a.classList.toggle('active-link', '#' + hash === a.getAttribute('href')
        || ('/' + a.dataset.route) === path);
    });
    fn();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  /* topbar search */
  $('#search-form').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#address').value.trim();
    if (v) { $('#address').value = ''; trackAddress(v); }
  });
  $('#paste-btn').addEventListener('click', async () => {
    try {
      const t = await navigator.clipboard.readText();
      if (t) $('#address').value = t.trim();
    } catch (_) { toast({ title: 'Clipboard unavailable', icon: '!' }); }
  });

  /* boot */
  if (!location.hash) location.hash = '#/wallet';
  route();
  </script>
</body>
</html>
