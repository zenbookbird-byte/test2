<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src * data: blob:; connect-src *; frame-src https:; object-src 'none'; base-uri 'none'" />
  <title>SuiSun — Sui Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-0: #07060f;
  --bg-1: #0d0b1d;
  --surface: rgba(255, 255, 255, 0.04);
  --surface-2: rgba(255, 255, 255, 0.07);
  --surface-3: rgba(255, 255, 255, 0.1);
  --stroke: rgba(255, 255, 255, 0.08);
  --stroke-strong: rgba(255, 255, 255, 0.16);
  --text: #ecebff;
  --muted: #8c87b3;
  --muted-2: #6a6790;
  --accent: #9945ff;
  --accent-2: #14f195;
  --accent-3: #7b61ff;
  --pos: #14f195;
  --neg: #ff5a76;
  --warn: #ffb347;
  --shadow: 0 30px 80px -30px rgba(120, 60, 255, 0.45);
  --radius: 18px;
  --radius-sm: 12px;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  color: var(--text);
  background: radial-gradient(1200px 800px at 80% -10%, #1a0f3d 0%, transparent 60%),
              radial-gradient(900px 700px at -10% 20%, #0b1f33 0%, transparent 55%),
              linear-gradient(180deg, var(--bg-0), var(--bg-1));
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

code, .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace; }

/* Aurora background blobs */
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; filter: blur(80px); opacity: .5; }
.blob { position: absolute; width: 520px; height: 520px; border-radius: 50%; mix-blend-mode: screen; }
.blob-1 { background: #9945ff; top: -10%; left: 10%; animation: float 18s ease-in-out infinite; }
.blob-2 { background: #14f195; top: 30%; right: -5%; animation: float 22s ease-in-out -6s infinite; }
.blob-3 { background: #4f8bff; bottom: -15%; left: 30%; animation: float 26s ease-in-out -10s infinite; }
@keyframes float {
  0%, 100% { transform: translate3d(0,0,0) scale(1); }
  50%      { transform: translate3d(40px, -30px, 0) scale(1.1); }
}

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(180deg, rgba(7,6,15,.92), rgba(7,6,15,.75) 70%, rgba(7,6,15,.6));
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--stroke);
}
.topbar-main {
  display: flex; align-items: center; gap: 18px;
  padding: 12px clamp(16px, 3vw, 32px);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: inherit; flex-shrink: 0;
}
.logo-mark svg { width: 32px; height: 32px; border-radius: 9px; box-shadow: var(--shadow); }
.brand h1 {
  margin: 0; font-size: 16px; letter-spacing: -.01em; font-weight: 700;
  background: linear-gradient(180deg, #ffffff, #c8c1ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  line-height: 1;
}
.brand-sub {
  margin: 2px 0 0; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted-2); font-weight: 600;
}
.brand-text { display: none; }
@media (min-width: 720px) { .brand-text { display: block; } }

/* Primary nav */
.primary-nav {
  display: none; align-items: center; gap: 2px; margin-left: 6px;
}
@media (min-width: 980px) { .primary-nav { display: flex; } }
.nav-item { position: relative; }
.nav-link {
  appearance: none; border: 0; background: transparent;
  color: var(--muted); font: inherit; font-size: 13.5px; font-weight: 500;
  padding: 9px 14px; border-radius: 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none;
  transition: color .2s, background .2s;
}
.nav-link:hover { color: var(--text); background: var(--surface); }
.nav-link-pro {
  background: linear-gradient(135deg, rgba(153,69,255,.18), rgba(20,241,149,.10));
  border: 1px solid rgba(153,69,255,.32);
  color: #d8c9ff;
}
.nav-link-pro:hover { background: linear-gradient(135deg, rgba(153,69,255,.28), rgba(20,241,149,.16)); color: #fff; }
.nav-ico { width: 16px; height: 16px; color: currentColor; opacity: .7; }
.caret { font-size: 10px; opacity: .7; transition: transform .2s; }
.nav-item:hover .caret,
.nav-item:focus-within .caret { transform: translateY(1px); }
.nav-item:hover > .nav-link,
.nav-item:focus-within > .nav-link {
  color: var(--text);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--stroke-strong);
}

/* Dropdown */
.dropdown {
  position: absolute; top: calc(100% + 8px); left: 0;
  min-width: 340px;
  padding: 10px;
  background: rgba(13, 11, 29, .96);
  border: 1px solid var(--stroke-strong);
  border-radius: 14px;
  box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .65), 0 0 0 1px rgba(255,255,255,.02);
  backdrop-filter: blur(16px);
  display: none;
  z-index: 30;
}
.dropdown.wide { min-width: 460px; }
.nav-item:hover > .dropdown,
.nav-item:focus-within > .dropdown { display: block; }
.dropdown-section + .dropdown-section {
  margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--stroke);
}
.dropdown-section h4 {
  margin: 6px 12px 8px; font-size: 10.5px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--muted-2); font-weight: 600;
}
.ddi {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  text-decoration: none; color: inherit;
  transition: background .15s, transform .15s;
}
.ddi:hover { background: var(--surface-2); }
.ddi.active-link {
  background: rgba(153, 69, 255, .12);
  box-shadow: inset 0 0 0 1px rgba(153, 69, 255, .35);
}
.ddi-ico {
  width: 36px; height: 36px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface-2); border: 1px solid var(--stroke);
  color: #c8c1ff; flex-shrink: 0;
}
.ddi-ico svg { width: 18px; height: 18px; }
.ddi-title {
  font-size: 13.5px; font-weight: 600; color: var(--text);
  display: flex; align-items: center; gap: 8px;
}
.ddi-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.here-pill {
  font-size: 9.5px; padding: 1px 6px; border-radius: 999px; letter-spacing: .08em;
  background: rgba(20, 241, 149, .18); color: #88f3c3; border: 1px solid rgba(20, 241, 149, .35);
  text-transform: uppercase; font-weight: 600;
}

.topbar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px; flex: 0 1 auto; min-width: 0;
}

.search-nav {
  flex: 1 1 280px; max-width: 460px; min-width: 0;
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--stroke);
  border-radius: 12px; padding: 4px 4px 4px 12px;
  transition: border-color .2s, box-shadow .2s;
}
.search-nav:focus-within {
  border-color: rgba(153, 69, 255, .55);
  box-shadow: 0 0 0 4px rgba(153, 69, 255, .15);
}
.search-nav .icon { width: 16px; height: 16px; color: var(--muted); }
.search-nav input {
  flex: 1; border: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 13px; padding: 8px 6px; outline: none;
  font-family: 'JetBrains Mono', monospace;
}
.search-nav input::placeholder { color: var(--muted-2); font-family: 'Inter', sans-serif; }

/* Ticker */
.ticker {
  display: flex; align-items: center; gap: 14px;
  padding: 8px clamp(16px, 3vw, 32px);
  border-top: 1px solid var(--stroke);
  background: rgba(7, 6, 15, .6);
  overflow: hidden;
}
.ticker-label {
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; flex-shrink: 0;
  padding-right: 12px; border-right: 1px solid var(--stroke);
}
.ticker-viewport {
  position: relative; flex: 1; overflow: hidden;
  mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent);
}
.ticker-track {
  display: inline-flex; gap: 28px; white-space: nowrap;
  animation: ticker-scroll 60s linear infinite;
  will-change: transform;
}
.ticker:hover .ticker-track { animation-play-state: paused; }
@keyframes ticker-scroll {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}
.ticker-item {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--text);
}
.ticker-item img {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface-2);
}
.ticker-sym { font-weight: 600; }
.ticker-price { color: var(--muted); font-variant-numeric: tabular-nums; }
.ticker-chg { font-weight: 600; font-variant-numeric: tabular-nums; font-size: 11.5px; }
.ticker-chg.pos { color: var(--pos); }
.ticker-chg.neg { color: var(--neg); }
.ticker-loading { padding: 2px 4px; }

.net-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 11px; border-radius: 999px; flex-shrink: 0;
  background: rgba(20,241,149,.1); border: 1px solid rgba(20,241,149,.3);
  color: #88f3c3; font-size: 11.5px; font-weight: 600;
}

/* Layout */
.container {
  position: relative; z-index: 2;
  max-width: 1200px; margin: 0 auto;
  padding: 24px clamp(16px, 3vw, 40px) 80px;
  display: grid; gap: 22px;
}

/* Glass surfaces */
.glass {
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  border: 1px solid var(--stroke);
  border-radius: var(--radius);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  box-shadow: var(--shadow);
}

/* Hero (empty state) */
/* Landing page (empty-state) */
.landing { display: grid; gap: 32px; padding-bottom: 16px; }
.landing-hero {
  position: relative; overflow: hidden;
  padding: clamp(48px, 7vw, 96px) clamp(24px, 4vw, 64px) clamp(40px, 5vw, 64px);
  border-radius: var(--radius);
  border: 1px solid var(--stroke);
  background:
    radial-gradient(900px 360px at 20% 0%, rgba(153, 69, 255, .18), transparent 60%),
    radial-gradient(700px 280px at 85% 90%, rgba(20, 241, 149, .12), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.015));
  text-align: center;
}
.landing-hero::before {
  content: ''; position: absolute; inset: -1px; pointer-events: none;
  background:
    radial-gradient(circle at 50% 0%, rgba(153, 69, 255, .25), transparent 40%);
  border-radius: inherit;
}
.landing-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  background: rgba(20, 241, 149, .08);
  border: 1px solid rgba(20, 241, 149, .25);
  color: #a3e8c8; font-size: 11.5px; font-weight: 500; letter-spacing: .04em;
  position: relative;
}
.dot-live {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--pos); box-shadow: 0 0 10px var(--pos);
  animation: pulse-dot 1.8s ease-in-out infinite;
}
.landing-title {
  position: relative;
  margin: 18px auto 14px; max-width: 18ch;
  font-size: clamp(32px, 5.5vw, 60px);
  font-weight: 800; letter-spacing: -0.03em; line-height: 1.04;
  color: var(--text);
}
.gradient-text {
  background: linear-gradient(135deg, #c4b1ff 0%, #9be9c8 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.landing-lede {
  position: relative; margin: 0 auto 28px; max-width: 56ch;
  color: var(--muted); font-size: 15px; line-height: 1.55;
}

/* Big hero search */
.hero-search {
  position: relative;
  display: flex; align-items: center; gap: 6px;
  max-width: 640px; margin: 0 auto 22px;
  padding: 6px 6px 6px 16px;
  background: var(--surface-2);
  border: 1px solid var(--stroke-strong);
  border-radius: 14px;
  transition: border-color .2s, box-shadow .2s;
}
.hero-search:focus-within {
  border-color: rgba(153, 69, 255, .55);
  box-shadow: 0 0 0 4px rgba(153, 69, 255, .15);
}
.hero-search .icon { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
.hero-search input {
  flex: 1; min-width: 0;
  appearance: none; border: 0; background: transparent;
  color: var(--text); font: inherit; font-size: 14.5px;
  font-family: 'JetBrains Mono', monospace;
  padding: 14px 8px; outline: none;
}
.hero-search input::placeholder { color: var(--muted-2); font-family: 'Inter', sans-serif; }
.hero-search .primary-btn { padding: 12px 18px; font-size: 13.5px; }

/* Live stats row */
.landing-stats {
  position: relative;
  display: inline-flex; align-items: center; gap: 0;
  padding: 10px 14px; border-radius: 14px;
  background: var(--surface);
  border: 1px solid var(--stroke);
  margin: 8px auto 18px;
  flex-wrap: wrap; justify-content: center;
}
.lstat {
  display: grid; gap: 2px; padding: 4px 18px;
  text-align: center;
}
.lstat-num {
  font-size: 18px; font-weight: 700; letter-spacing: -.01em;
  font-variant-numeric: tabular-nums; color: var(--text);
}
.lstat-lbl {
  font-size: 10.5px; color: var(--muted-2);
  text-transform: uppercase; letter-spacing: .1em; font-weight: 500;
}
.lstat-sep {
  width: 1px; height: 26px; background: var(--stroke); flex-shrink: 0;
}
@media (max-width: 720px) {
  .lstat-sep { display: none; }
  .lstat { padding: 4px 10px; }
}

.landing-cta-row {
  display: inline-flex; flex-wrap: wrap; gap: 10px; justify-content: center;
  position: relative;
}

/* Landing sections (cards) */
.landing-section {
  display: grid; gap: 14px;
  padding: 0 clamp(0px, 1vw, 8px);
}
.landing-section-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 0 6px;
}
.landing-section-head h3 { margin: 0; font-size: 16px; font-weight: 600; }

/* Sample-wallet cards */
.sample-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.sample-card {
  appearance: none; cursor: pointer; text-align: left;
  display: flex; align-items: center; gap: 14px;
  padding: 16px 18px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
  color: var(--text); font: inherit;
  transition: background .15s, border-color .15s, transform .15s;
}
.sample-card:hover {
  background: var(--surface-2); border-color: var(--stroke-strong);
  transform: translateY(-2px);
}
.sample-av {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  position: relative; box-shadow: 0 6px 18px -10px rgba(153, 69, 255, .6);
}
.sample-av::after {
  content: ''; position: absolute; inset: 5px; border-radius: 8px;
  background: rgba(10, 8, 26, .55);
}
.sample-meta { flex: 1; min-width: 0; display: grid; gap: 2px; }
.sample-name { font-weight: 600; font-size: 14px; }
.sample-sub  { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
.sample-tag {
  font-size: 10px; padding: 3px 9px; border-radius: 999px;
  background: rgba(153, 69, 255, .14); color: #c8b6ff;
  border: 1px solid rgba(153, 69, 255, .3);
  letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
}

/* Feature cards */
.landing-features {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.lfeat {
  display: grid; gap: 8px; align-content: start;
  padding: 18px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
  color: var(--text); text-decoration: none;
  transition: background .15s, border-color .15s, transform .15s;
}
.lfeat:hover {
  background: var(--surface-2); border-color: var(--stroke-strong);
  transform: translateY(-2px);
}
.lfeat-ico {
  width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, rgba(153, 69, 255, .25), rgba(20, 241, 149, .18));
  border: 1px solid rgba(153, 69, 255, .3);
  color: #fff; margin-bottom: 4px;
}
.lfeat h4 { margin: 0; font-size: 14.5px; font-weight: 600; }
.lfeat p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.55; }

/* Bottom CTA */
.landing-footer-cta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 18px; flex-wrap: wrap;
  padding: 22px clamp(20px, 3vw, 32px);
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(153, 69, 255, .14), rgba(20, 241, 149, .1));
  border: 1px solid rgba(153, 69, 255, .35);
}
.landing-footer-cta h3 { margin: 0; font-size: 18px; font-weight: 700; }
.landing-footer-cta p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }

/* Buttons */
.primary-btn {
  appearance: none; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 16px; border-radius: 10px;
  color: #0a0820; font: inherit; font-weight: 600; font-size: 13px;
  background: linear-gradient(135deg, #c4b1ff 0%, #9be9c8 100%);
  box-shadow: 0 14px 30px -14px rgba(153, 69, 255, .8);
  transition: transform .15s ease, box-shadow .2s;
}
.primary-btn.small { padding: 7px 12px; font-size: 12px; border-radius: 8px; }
.primary-btn:hover { transform: translateY(-1px); }

.ghost-btn {
  appearance: none; cursor: pointer;
  border: 1px solid var(--stroke); background: transparent; color: var(--text);
  padding: 8px 12px; border-radius: 10px; font: inherit; font-size: 13px;
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
  transition: background .2s, border-color .2s, color .2s;
}
.ghost-btn:hover { background: var(--surface); border-color: var(--stroke-strong); }
.ghost-btn.small { padding: 5px 10px; font-size: 12px; border-radius: 8px; }
.ghost-btn[aria-pressed="true"] {
  background: rgba(153, 69, 255, .14); border-color: rgba(153, 69, 255, .45); color: #d8c9ff;
}

/* Status */
.status {
  padding: 14px 18px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
  display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 14px;
}
.status.error { color: #ffd2da; border-color: rgba(255, 90, 118, .35); background: rgba(255, 90, 118, .08); }
.status.loading::before {
  content: ""; width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,.2); border-top-color: var(--text);
  animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Dashboard */
.dashboard { display: grid; gap: 18px; }
.card { padding: clamp(18px, 2.2vw, 26px); }
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; gap: 12px; flex-wrap: wrap;
}
.card-head h3 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
.card-tools { display: flex; gap: 8px; align-items: center; }
.muted { color: var(--muted); font-size: 12px; }
.muted.small { font-size: 11px; }

/* Portfolio header card */
.account-head { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.avatar {
  width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
  background: conic-gradient(from 180deg at 50% 50%, #9945ff, #14f195, #4f8bff, #9945ff);
  box-shadow: 0 10px 30px -12px rgba(153, 69, 255, .8);
  position: relative;
}
.avatar::after {
  content: ""; position: absolute; inset: 6px; border-radius: 10px;
  background: rgba(10, 8, 26, .55);
}
.account-meta { display: grid; gap: 6px; min-width: 0; flex: 1; }
.account-meta .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.account-meta .label { color: var(--muted); font-size: 12px; margin-right: 2px; }
.addr {
  font-size: 13px; color: #cfcaff; word-break: break-all;
  background: var(--surface); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--stroke);
  display: inline-block;
}
.account-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag-pill {
  font-size: 11px; padding: 3px 8px; border-radius: 999px; letter-spacing: .3px;
  background: rgba(20, 241, 149, .12); color: #88f3c3; border: 1px solid rgba(20, 241, 149, .25);
}
.tag-pill.warn { background: rgba(255, 179, 71, .12); color: #ffce91; border-color: rgba(255, 179, 71, .3); }

.portfolio-summary {
  display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr); gap: 22px;
  padding-top: 18px; border-top: 1px solid var(--stroke);
}
@media (max-width: 800px) { .portfolio-summary { grid-template-columns: 1fr; } }
.port-value { display: grid; gap: 6px; align-content: start; }
.port-value-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.big {
  font-size: clamp(34px, 5vw, 48px); font-weight: 800; letter-spacing: -.02em;
  background: linear-gradient(180deg, #ffffff, #c8c1ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  line-height: 1;
}
.big-sm { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }

.delta { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.delta.pos { color: var(--pos); }
.delta.neg { color: var(--neg); }
.delta.neutral { color: var(--muted); }

.stat-grid {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
.stat {
  padding: 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--stroke);
  display: grid; gap: 4px; align-content: start;
}
.stat-label { color: var(--muted); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }
.stat-value { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.stat-value small { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.stat-sub { color: var(--muted); font-size: 11.5px; }

.hint {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--stroke);
  color: var(--muted); font-size: 9px; cursor: help; margin-left: 4px;
}

/* Tabs */
.tabs {
  display: flex; gap: 4px; padding: 4px; align-self: start;
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 12px;
  overflow-x: auto;
}
.tab {
  appearance: none; border: 0; cursor: pointer;
  background: transparent; color: var(--muted); font: inherit;
  font-size: 13px; font-weight: 500;
  padding: 9px 14px; border-radius: 9px;
  display: inline-flex; align-items: center; gap: 8px;
  transition: color .2s, background .2s;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--stroke-strong); }
.tab-badge {
  font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--stroke); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tab-badge.soft { background: rgba(153, 69, 255, .15); color: #c8b6ff; border-color: rgba(153, 69, 255, .3); }

.tab-panel { display: grid; gap: 18px; }
.tab-panel[hidden] { display: none; }

/* Filter input */
.filter-input {
  appearance: none; border: 1px solid var(--stroke);
  background: var(--surface); color: var(--text); font: inherit; font-size: 12px;
  padding: 6px 10px; border-radius: 8px; min-width: 200px;
}
.filter-input:focus { outline: none; border-color: rgba(153, 69, 255, .45); }

/* Table */
.table-wrap { overflow-x: auto; margin: 0 -8px; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 640px; }
.holdings-table { min-width: 880px; }
.t-ata { font-size: 11.5px; font-family: 'JetBrains Mono', monospace; }
.t-ata:hover { color: var(--text); }
.t-ext { font-size: 11px; }
.table thead th {
  text-align: left; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
  padding: 10px 12px; border-bottom: 1px solid var(--stroke);
}
.table tbody td {
  padding: 14px 12px; border-bottom: 1px solid var(--stroke);
  font-size: 13.5px; vertical-align: middle;
}
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr { transition: background .15s; }
.table tbody tr:hover { background: var(--surface); }
.table .num { text-align: right; font-variant-numeric: tabular-nums; }

.token-id { display: flex; align-items: center; gap: 12px; min-width: 0; }
.token-logo {
  width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, #9945ff, #14f195);
  box-shadow: inset 0 0 0 2px rgba(0,0,0,.25);
  object-fit: cover;
}
.token-logo.fallback { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 11px; color: #0a0820; }
.token-text { min-width: 0; }
.token-sym { font-weight: 600; font-size: 14px; }
.token-sub { font-size: 11px; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

.alloc-cell { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.alloc-bar {
  width: 70px; height: 6px; border-radius: 999px; background: var(--surface-2);
  overflow: hidden; border: 1px solid var(--stroke);
}
.alloc-fill {
  display: block; height: 100%;
  background: linear-gradient(90deg, #9945ff, #14f195);
  width: 0%;
}
.t-alloc { font-size: 12px; color: var(--muted); width: 44px; text-align: right; }

.empty {
  padding: 28px; text-align: center; color: var(--muted); font-size: 13px;
  border: 1px dashed var(--stroke-strong); border-radius: 12px;
}

/* Transactions */
.tx-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tx-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 16px; align-items: center;
  padding: 12px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--stroke);
}
.tx-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tx-icon {
  width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(20, 241, 149, .12); color: var(--pos);
  border: 1px solid rgba(20, 241, 149, .25); font-size: 14px;
}
.tx-icon.err { background: rgba(255, 90, 118, .12); color: var(--neg); border-color: rgba(255, 90, 118, .3); }
.tx-icon.unknown { background: var(--surface-2); color: var(--muted); border-color: var(--stroke); }
.tx-title { font-size: 13.5px; font-weight: 500; }
.tx-sig {
  font-size: 11.5px; color: var(--muted); text-decoration: none;
}
.tx-sig:hover { color: var(--text); text-decoration: underline; }
.tx-fee { font-size: 11.5px; }
.tx-right { text-align: right; }
.tx-time { font-size: 12.5px; }
.tx-slot { font-size: 11px; }

/* Analytics */
.grid-2 { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
.composition { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
.donut { position: relative; width: 180px; height: 180px; flex-shrink: 0; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut-bg { fill: transparent; stroke: var(--surface-2); stroke-width: 5; }
.donut-seg { fill: transparent; stroke-width: 5; transition: stroke-dasharray .6s ease; }
.donut-center {
  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px;
}
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; min-width: 220px; flex: 1; }
.legend li {
  display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center;
  font-size: 12.5px;
}
.legend .dot { width: 10px; height: 10px; border-radius: 3px; }
.legend .name { font-weight: 500; }
.legend .val { color: var(--muted); font-variant-numeric: tabular-nums; }
.legend .pct { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

.movers { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.movers li {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; background: var(--surface); border: 1px solid var(--stroke); border-radius: 10px;
}
.movers .left { display: flex; gap: 10px; align-items: center; }
.movers img { width: 24px; height: 24px; border-radius: 50%; }

.kv {
  margin: 0; display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}
.kv > div {
  padding: 10px 12px; background: var(--surface); border: 1px solid var(--stroke); border-radius: 10px;
  display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px;
}
.kv dt { color: var(--muted); margin: 0; }
.kv dd { margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: right; word-break: break-all; }

.note { margin: 14px 0 0; }

/* Footer */
.footer {
  position: relative; z-index: 2;
  text-align: center; padding: 24px;
  color: var(--muted); font-size: 12px;
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.footer .dot { opacity: .5; }

/* Page view (full page sections rendered into #page-view) */
.page-view { display: grid; gap: 18px; }
.page-view[hidden] { display: none; }
.page-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  flex-wrap: wrap; gap: 16px;
}
.page-title {
  margin: 0; font-size: clamp(24px, 3.2vw, 34px); font-weight: 800; letter-spacing: -.02em;
  background: linear-gradient(180deg, #ffffff, #c8c1ff);
  -webkit-background-clip: text; background-clip: text; color: transparent; line-height: 1.05;
}
.page-sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.breadcrumb { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
.breadcrumb a { color: var(--muted); text-decoration: none; }
.breadcrumb a:hover { color: var(--text); }
.breadcrumb .sep { opacity: .5; }
.page-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* Source chips for Trading pages */
.source-chips {
  display: flex; flex-wrap: wrap; gap: 6px;
  padding: 2px 0;
}
.source-chip {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--stroke);
  color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 500;
  transition: background .15s, border-color .15s, color .15s;
}
.source-chip:hover { color: var(--text); border-color: var(--stroke-strong); }
.source-chip.active {
  color: var(--text);
  background: hsl(var(--src-hue, 260) 70% 28% / .35);
  border-color: hsl(var(--src-hue, 260) 80% 60% / .55);
  box-shadow: 0 0 0 1px hsl(var(--src-hue, 260) 80% 60% / .25);
}
.source-chip .src-count {
  font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
  background: rgba(255, 255, 255, .06); color: inherit;
  font-variant-numeric: tabular-nums;
}
.source-pill {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 999px;
  background: hsl(var(--src-hue, 260) 70% 25% / .45);
  color: hsl(var(--src-hue, 260) 85% 80%);
  border: 1px solid hsl(var(--src-hue, 260) 75% 55% / .35);
  font-size: 11px; font-weight: 600;
}

/* Range tabs */
.range-tabs {
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 10px;
}
.range-tabs button {
  appearance: none; border: 0; background: transparent; color: var(--muted);
  padding: 6px 12px; border-radius: 8px; font: inherit; font-size: 12px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.range-tabs button.active { color: var(--text); background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--stroke-strong); }

/* Generic full-page table card */
.page-table { padding: 0 !important; overflow: hidden; }
.page-table .table-wrap { margin: 0; }
.page-table .table thead th { padding: 14px 16px; background: rgba(255,255,255,.02); }
.page-table .table tbody td { padding: 14px 16px; }
.page-table .table tbody tr { cursor: pointer; }
.page-table .table th.sortable { cursor: pointer; user-select: none; }
.page-table .table th.sortable:hover { color: var(--text); }
.page-table .table th .sort-ind { opacity: 0; margin-left: 4px; }
.page-table .table th.sorted .sort-ind { opacity: 1; }

/* ===== Trending — dense market table (Padre-style) ===== */
.trend-card {
  background: #0a0c17; border: 1px solid #1c1f2e; border-radius: 12px;
  overflow: hidden;
}
.trend-scroll { overflow-x: auto; }
.trend-scroll::-webkit-scrollbar { height: 8px; }
.trend-scroll::-webkit-scrollbar-thumb { background: #1c1f2e; border-radius: 4px; }
.trend-table {
  width: 100%; border-collapse: collapse; min-width: 1080px;
  font-size: 12.5px; font-variant-numeric: tabular-nums;
}
.trend-table thead th {
  position: sticky; top: 0; z-index: 2;
  background: #0d1020; color: #565a76;
  font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
  text-align: right; padding: 10px 14px; white-space: nowrap;
  border-bottom: 1px solid #1c1f2e; cursor: pointer; user-select: none;
}
.trend-table thead th:first-child,
.trend-table thead th.tcol-tok { text-align: left; }
.trend-table thead th:hover { color: var(--text); }
.trend-table thead th.sorted { color: #c4b1ff; }
.trend-table thead th .ind { opacity: .6; font-size: 9px; }
.trend-table tbody td {
  padding: 9px 14px; text-align: right; white-space: nowrap;
  border-bottom: 1px solid #14172a; color: var(--text);
}
.trend-table tbody tr { cursor: pointer; transition: background .1s; }
.trend-table tbody tr:hover td { background: #11142a; }
.trend-table tbody tr:last-child td { border-bottom: 0; }
.trend-rank { color: #565a76; font-weight: 600; text-align: left !important; width: 30px; }

/* Token cell */
.trend-tok { display: flex; align-items: center; gap: 10px; text-align: left; min-width: 200px; }
.trend-logo {
  width: 34px; height: 34px; border-radius: 9px; flex-shrink: 0; object-fit: cover;
  background: #14172a;
}
.trend-logo.fallback {
  display: grid; place-items: center; color: #0a0820; font-weight: 700; font-size: 12px;
  background: linear-gradient(135deg, #9945ff, #14f195);
}
.trend-tok-text { min-width: 0; }
.trend-tok-top { display: flex; align-items: center; gap: 6px; }
.trend-sym { font-weight: 700; font-size: 13px; color: var(--text); }
.trend-src {
  font-size: 8.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 4px;
  background: hsl(var(--src-hue,260) 70% 24% / .6); color: hsl(var(--src-hue,260) 85% 80%);
  border: 1px solid hsl(var(--src-hue,260) 75% 55% / .35);
}
.trend-tok-sub {
  display: flex; align-items: center; gap: 6px; margin-top: 1px;
  font-size: 10.5px; color: var(--muted);
}
.trend-tok-sub .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
.trend-tok-sub a { color: #6a6e8a; text-decoration: none; font-size: 11px; }
.trend-tok-sub a:hover { color: var(--text); }

.trend-delta.pos { color: #14f195; }
.trend-delta.neg { color: #ff5a76; }
.trend-delta.neutral { color: var(--muted); }
.trend-table td.tcol-active { background: rgba(196,177,255,.05); }
.trend-table th.tcol-active { color: #c4b1ff; }

.trend-txns { display: inline-flex; flex-direction: column; align-items: flex-end; line-height: 1.25; }
.trend-txns .b { color: #14f195; font-weight: 600; }
.trend-txns .s { color: #ff5a76; }

.trend-spark { width: 72px; height: 22px; vertical-align: middle; }

.trend-buy {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
  background: linear-gradient(180deg, #5b6cff, #4858e8);
  color: #fff; border: 1px solid #6a7aff;
  font: inherit; font-size: 11px; font-weight: 700;
  padding: 5px 10px; border-radius: 7px;
}
.trend-buy::before { content: '⚡'; font-size: 10px; }
.trend-buy:hover { filter: brightness(1.1); }

.trend-acts { display: flex; gap: 5px; align-items: center; white-space: nowrap; }
.trend-sell, .trend-star {
  appearance: none; cursor: pointer; font: inherit; font-size: 11px; font-weight: 700;
  padding: 5px 9px; border-radius: 7px;
  background: transparent; border: 1px solid var(--stroke-strong); color: var(--muted);
}
.trend-sell:hover { color: #ff5d6c; border-color: #ff5d6c; }
.trend-star:hover { color: #ffd25d; border-color: #ffd25d; }
.trend-star.active { color: #ffd25d; border-color: #ffd25d; }

.trend-toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 8px;
}
.trend-count { font-size: 11.5px; color: var(--muted); margin-left: auto; }

/* Nav link active state */
.nav-link.is-active,
.ddi.is-active { color: var(--text); }
.ddi.is-active { background: rgba(153, 69, 255, .14); box-shadow: inset 0 0 0 1px rgba(153, 69, 255, .3); }
.nav-link.is-active { background: var(--surface); }

/* Swap page */
/* Swap page — Jupiter-style */
.swap-page {
  display: flex; flex-wrap: wrap;
  justify-content: center; align-items: flex-start;
  gap: 18px;
}
.swap-card {
  flex: 0 0 auto;
  width: 480px; max-width: 100%;
  padding: 18px 18px 16px;
  display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  border: 1px solid var(--stroke);
  border-radius: 22px;
  box-shadow: 0 30px 80px -30px rgba(120, 60, 255, 0.45);
  position: relative;
  isolation: isolate;
  z-index: 2;
  overflow: hidden;
}
.swap-side {
  flex: 0 0 auto;
  width: 360px; max-width: 100%;
}
@media (max-width: 900px) {
  .swap-card, .swap-side { width: 100%; }
}
.swap-card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 6px 8px;
}
.swap-card-head h3 { margin: 0; font-size: 17px; font-weight: 700; }
.swap-card-head .right { display: flex; gap: 4px; align-items: center; }
.swap-icon-btn {
  appearance: none; cursor: pointer;
  width: 32px; height: 32px; border-radius: 10px;
  background: transparent; border: 1px solid transparent;
  color: var(--muted); display: grid; place-items: center;
  transition: background .15s, border-color .15s, color .15s;
}
.swap-icon-btn:hover { background: var(--surface); border-color: var(--stroke); color: var(--text); }
.swap-icon-btn[aria-expanded="true"] { background: var(--surface); border-color: var(--stroke-strong); color: var(--text); }
.swap-icon-btn svg { width: 18px; height: 18px; }

.swap-token {
  position: relative;
  padding: 16px 18px;
  border-radius: 16px;
  background: var(--surface);
  border: 1px solid var(--stroke);
  display: flex; flex-direction: column; gap: 10px;
  min-width: 0;
  transition: border-color .15s;
}
.swap-token:focus-within { border-color: rgba(153, 69, 255, .45); }
.swap-token-head {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 12px; color: var(--muted); font-weight: 500;
}
.swap-token-head .max-btn {
  appearance: none; cursor: pointer;
  background: rgba(153, 69, 255, .15); color: #d8c9ff;
  border: 1px solid rgba(153, 69, 255, .3);
  font: inherit; font-size: 10.5px; font-weight: 600;
  padding: 3px 8px; border-radius: 999px; letter-spacing: .04em;
}
.swap-token-head .max-btn:hover { background: rgba(153, 69, 255, .25); }
.swap-token-body {
  display: flex; align-items: center; gap: 12px;
  min-width: 0;
}
.swap-token > * { min-width: 0; max-width: 100%; }
.swap-pick {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 10px 8px 8px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--stroke-strong);
  cursor: pointer; font: inherit; color: var(--text);
  min-width: 0; flex-shrink: 0;
  transition: background .15s, border-color .15s;
}
.swap-pick:hover { background: var(--surface-3); border-color: rgba(153, 69, 255, .35); }
.swap-pick img {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--surface-3);
}
.swap-pick .swap-pick-sym {
  font-weight: 700; font-size: 15px; letter-spacing: -.01em;
}
.swap-pick .swap-pick-caret { margin-left: 2px; opacity: .55; font-size: 11px; }

.swap-amount {
  flex: 1 1 0; min-width: 0; width: 0;
  appearance: none; border: 0; background: transparent;
  color: var(--text); font: inherit; font-size: 30px; font-weight: 600;
  outline: none; font-variant-numeric: tabular-nums; text-align: right;
  letter-spacing: -.02em;
  font-family: 'Inter', sans-serif;
}
.swap-amount::placeholder { color: var(--muted-2); font-weight: 500; }
.swap-amount[readonly] { cursor: default; }
.swap-amount.out { color: var(--text); }

.swap-meta {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11.5px; color: var(--muted);
}
.swap-meta .mono { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted-2); }
.swap-meta .usd  { font-variant-numeric: tabular-nums; }

/* Circular flip button — sits inside a 0-height row that overflows
 * symmetrically into the panels above & below. No negative margins
 * on the wrap, so the panel layout stays correct; the button just
 * floats over the seam visually. */
.swap-flip-wrap {
  position: relative; height: 0;
  display: flex; justify-content: center; align-items: center;
  z-index: 3; overflow: visible;
}
.swap-flip {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 36px; height: 36px;
  border-radius: 12px; cursor: pointer;
  background: var(--surface-2);
  border: 4px solid #0b0a14;
  display: grid; place-items: center;
  color: var(--muted);
  box-shadow: 0 0 0 1px var(--stroke-strong);
  transition: transform .25s ease, color .15s, box-shadow .15s;
}
.swap-flip:hover {
  transform: translate(-50%, -50%) rotate(180deg);
  color: var(--text);
  box-shadow: 0 0 0 1px rgba(153, 69, 255, .55);
}
.swap-flip svg { width: 16px; height: 16px; }

/* Quote info block */
.swap-summary {
  margin-top: 6px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--stroke);
  border-radius: 12px;
  font-size: 12.5px;
  display: grid; gap: 4px;
}
.swap-summary .summary-top {
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer;
}
.swap-summary .summary-rate { font-weight: 500; }
.swap-summary .summary-rate .muted { color: var(--muted); margin-right: 6px; }
.swap-summary .chev { color: var(--muted); transition: transform .15s; font-size: 11px; }
.swap-summary.open .chev { transform: rotate(180deg); }
.swap-summary .details {
  margin-top: 6px;
  padding-top: 8px;
  border-top: 1px solid var(--stroke);
  display: none; gap: 6px; grid-template-columns: 1fr;
}
.swap-summary.open .details { display: grid; }
.swap-summary .row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.swap-summary .label { color: var(--muted); }
.swap-summary .value { font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; }
.swap-route { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: flex-end; }
.swap-route .hop {
  font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--stroke);
  color: var(--text);
}
.swap-route .arrow { color: var(--muted-2); font-size: 9px; }

/* Settings popover */
.swap-settings-pop {
  position: absolute; top: 56px; right: 14px; z-index: 50;
  width: 280px;
  padding: 14px; border-radius: 14px;
  background: rgba(13, 11, 29, .98);
  border: 1px solid var(--stroke-strong);
  box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .7);
  display: none;
}
.swap-settings-pop.open { display: block; }
.swap-settings-pop h5 {
  margin: 0 0 8px; font-size: 11px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--muted); font-weight: 600;
}
.slip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.slip-chip {
  appearance: none; cursor: pointer;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--stroke);
  padding: 7px 12px; border-radius: 10px;
  font: inherit; font-size: 12.5px; font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.slip-chip:hover { border-color: var(--stroke-strong); }
.slip-chip.active {
  background: rgba(153, 69, 255, .18); color: #d8c9ff;
  border-color: rgba(153, 69, 255, .45);
}
.slip-custom {
  width: 78px;
  appearance: none; background: var(--surface); color: var(--text);
  border: 1px solid var(--stroke); border-radius: 10px;
  padding: 7px 10px; font: inherit; font-size: 12.5px;
  font-variant-numeric: tabular-nums;
}

/* Primary CTA */
.swap-cta {
  margin-top: 4px;
  padding: 16px; border-radius: 14px;
  font: inherit; font-weight: 700; font-size: 15px; letter-spacing: -.01em;
  background: linear-gradient(135deg, #c4b1ff 0%, #9be9c8 100%);
  color: #0a0820; border: 0; cursor: pointer;
  box-shadow: 0 14px 30px -14px rgba(153, 69, 255, .8);
  transition: transform .15s, filter .15s;
}
.swap-cta:hover { transform: translateY(-1px); filter: brightness(1.05); }
.swap-cta:disabled { opacity: .65; cursor: wait; transform: none; }
.swap-cta.muted-cta {
  background: var(--surface-2); color: var(--text);
  box-shadow: none; border: 1px solid var(--stroke-strong);
}

.swap-powered {
  text-align: center; padding: 8px 0 0;
  font-size: 10.5px; color: var(--muted-2); letter-spacing: .08em;
}
.swap-powered strong { color: var(--muted); }

.swap-side .card-head { margin-bottom: 12px; }
.swap-pair-list { display: grid; gap: 8px; max-height: 480px; overflow-y: auto; padding-right: 4px; }

/* Mode tabs */
.swap-modes {
  display: inline-flex; gap: 2px; padding: 4px;
  background: var(--surface); border: 1px solid var(--stroke); border-radius: 10px;
}
.swap-modes button {
  appearance: none; border: 0; background: transparent;
  color: var(--muted); font: inherit; font-size: 12.5px; font-weight: 600;
  padding: 6px 12px; border-radius: 8px; cursor: pointer;
  transition: color .15s, background .15s;
}
.swap-modes button:hover { color: var(--text); }
.swap-modes button.active {
  background: rgba(190, 245, 116, .12);
  color: #d1f493;
  border: 1px solid rgba(190, 245, 116, .35);
}
.mode-badge {
  appearance: none; cursor: pointer; font: inherit;
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; padding: 5px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--stroke);
  color: var(--muted); font-weight: 500; letter-spacing: .04em;
  transition: color .15s, background .15s, border-color .15s;
}
.mode-badge:hover { color: var(--text); background: var(--surface-2); border-color: var(--stroke-strong); }
.mode-badge[aria-expanded="true"] { color: var(--text); background: var(--surface-2); border-color: rgba(153, 69, 255, .45); }

/* Limit-mode specific panels */
.swap-token.price-token .swap-token-body { gap: 10px; }
.swap-token.alloc .alloc-actions { display: inline-flex; gap: 6px; }
.swap-token.alloc .max-btn { background: var(--surface-2); color: var(--text); border-color: var(--stroke-strong); }
.swap-token.alloc .max-btn:hover { background: var(--surface-3); }
.paste-ca-btn {
  appearance: none; cursor: pointer;
  background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--stroke); font: inherit; font-size: 10.5px;
  padding: 3px 8px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 4px;
}
.paste-ca-btn:hover { background: var(--surface-3); color: var(--text); }

.limit-price-label {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--stroke);
  color: var(--text); font-size: 13px; font-weight: 600;
  white-space: nowrap;
}
.price-header strong { color: var(--text); }

.pct-chips { display: inline-flex; gap: 4px; }
.pct-chips button {
  appearance: none; cursor: pointer;
  background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--stroke); font: inherit; font-size: 11px;
  padding: 3px 8px; border-radius: 6px; font-weight: 600;
}
.pct-chips button:hover { color: var(--text); }
.pct-chips button.active {
  background: rgba(153, 69, 255, .18); color: #d8c9ff;
  border-color: rgba(153, 69, 255, .4);
}
.pct-chips button.pct-custom { font-variant-numeric: tabular-nums; min-width: 56px; }

.tpsl-row { display: flex; gap: 18px; padding: 8px 4px; font-size: 12.5px; color: var(--muted); }
.tpsl-row label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.tpsl-row .dashed { border-bottom: 1px dashed var(--stroke-strong); padding-bottom: 1px; }
.tpsl-row input[type=checkbox] {
  appearance: none; width: 14px; height: 14px;
  border: 1px solid var(--stroke-strong); border-radius: 3px; background: var(--surface);
  cursor: pointer; display: inline-grid; place-items: center;
}
.tpsl-row input[type=checkbox]:checked {
  background: rgba(153, 69, 255, .25);
  border-color: rgba(153, 69, 255, .55);
}
.tpsl-row input[type=checkbox]:checked::after { content: '✓'; font-size: 10px; color: #d8c9ff; }

.expiry-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--stroke);
  font-size: 13px; color: var(--muted);
}
.select-soft {
  appearance: none; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--stroke);
  color: var(--text); font: inherit; font-size: 12.5px;
  padding: 6px 28px 6px 12px; border-radius: 8px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238c87b3'><path d='M7 10l5 5l5-5z'/></svg>");
  background-repeat: no-repeat; background-position: right 6px center; background-size: 16px;
}

.limit-callout {
  padding: 12px 14px; border-radius: 12px;
  background: rgba(255, 90, 118, .06); border: 1px solid rgba(255, 90, 118, .25);
  font-size: 12.5px; line-height: 1.55; color: var(--text);
}
.limit-callout strong { color: var(--text); }
.limit-callout .neg { color: var(--neg); font-weight: 600; }
.limit-callout u { text-decoration: underline; text-decoration-style: dashed; text-underline-offset: 2px; }

/* DCA panels */
.dca-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dca-range { display: flex; align-items: center; gap: 8px; }
.dca-range input.swap-amount {
  flex: 1; min-width: 0; font-size: 16px; font-weight: 500;
  padding: 8px 12px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--stroke);
  text-align: left;
}
.dca-range-sep { color: var(--muted-2); }

/* Static (always-open) summary used for Limit/Recurring */
.swap-summary.static .summary-top { cursor: default; }
.swap-summary.open.static .details { display: grid; }
.swap-summary .pos { color: var(--pos); }

/* Card footer with Show Chart / History */
.swap-card-foot {
  display: flex; gap: 8px; padding: 4px 0;
}
.swap-foot-btn {
  appearance: none; cursor: pointer;
  flex: 1;
  background: var(--surface); color: var(--muted);
  border: 1px solid var(--stroke);
  font: inherit; font-size: 12.5px; font-weight: 500;
  padding: 9px 14px; border-radius: 10px;
}
.swap-foot-btn:hover { color: var(--text); background: var(--surface-2); }

/* Bottom token row (matches jup.ag) */
.swap-token-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  width: 480px; max-width: 100%; margin: 0 auto;
}
@media (max-width: 640px) { .swap-token-row { grid-template-columns: 1fr; } }
.swap-token-card {
  padding: 14px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
  display: grid; gap: 8px; min-height: 130px;
}
.stc-head { display: flex; align-items: center; gap: 10px; }
.stc-logo { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; background: var(--surface-2); }
.stc-logo.fallback {
  display: grid; place-items: center; color: #0a0820; font-weight: 700; font-size: 10px;
  background: linear-gradient(135deg, #9945ff, #14f195);
}
.stc-name { flex: 1; min-width: 0; }
.stc-sym  { font-weight: 700; font-size: 14px; }
.stc-mint { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
.stc-px { text-align: right; }
.stc-price { font-weight: 700; font-variant-numeric: tabular-nums; }
.stc-chg { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stc-chg.pos { color: var(--pos); }
.stc-chg.neg { color: var(--neg); }
.stc-spark { width: 100%; height: 56px; }
.stc-spark svg { display: block; }
.stc-open {
  appearance: none; cursor: pointer; text-align: left;
  background: none; border: 0; color: var(--muted); font: inherit; font-size: 11.5px;
  padding: 0; margin-top: -2px;
}
.stc-open:hover { color: var(--text); }

/* Token picker modal list */
.token-picker { max-height: 60vh; overflow: auto; display: grid; gap: 4px; }
.token-picker input.filter-input { width: 100%; margin-bottom: 8px; }
.token-picker-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px; cursor: pointer;
  background: transparent; border: 1px solid transparent;
}
.token-picker-row:hover { background: var(--surface); border-color: var(--stroke); }
.token-picker-row img { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); }
.token-picker-row .name { flex: 1; min-width: 0; }
.token-picker-row .sym { font-weight: 600; font-size: 13px; }
.token-picker-row .sub { font-size: 11px; color: var(--muted); }

/* Product / Developers landing pages */
.product-hero {
  padding: 28px 32px;
  display: grid; gap: 12px;
}
.product-hero .badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(153, 69, 255, .15); color: #d8c9ff;
  border: 1px solid rgba(153, 69, 255, .3);
  font-size: 11px; letter-spacing: .1em; text-transform: uppercase; width: max-content;
}
.feature-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
}
.feature {
  padding: 18px; border-radius: 14px;
  background: var(--surface); border: 1px solid var(--stroke);
  display: grid; gap: 8px; align-content: start;
}
.feature .f-ico {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, rgba(153,69,255,.3), rgba(20,241,149,.25));
  border: 1px solid var(--stroke);
  display: grid; place-items: center; color: #ecebff;
}
.feature h4 { margin: 0; font-size: 14px; font-weight: 600; }
.feature p { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.5; }

.code-block {
  margin: 0;
  padding: 14px 16px; border-radius: 12px;
  background: rgba(0,0,0,.45); border: 1px solid var(--stroke);
  font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.6;
  color: #cfcaff; overflow: auto; white-space: pre;
}

/* Empty page state */
.page-empty {
  padding: 60px 24px; text-align: center; color: var(--muted);
  border-radius: 14px; border: 1px dashed var(--stroke-strong);
}
.page-empty h3 { color: var(--text); margin: 0 0 6px; font-size: 18px; }
.page-empty p { margin: 0; font-size: 13px; }

/* User menu */
.user-menu { position: relative; flex-shrink: 0; }
.user-btn {
  appearance: none; border: 1px solid var(--stroke); background: var(--surface);
  color: var(--text); font: inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px 4px 4px; border-radius: 999px;
  transition: background .15s, border-color .15s;
}
.user-btn:hover { background: var(--surface-2); border-color: var(--stroke-strong); }
.user-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center;
  background: linear-gradient(135deg, hsl(280 85% 60%), hsl(160 80% 55%));
  color: #0a0820; font-weight: 700; font-size: 11.5px;
  border: 1px solid rgba(255,255,255,.18);
}
.user-label { font-size: 12.5px; font-weight: 500; max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-dropdown {
  display: none;
  position: absolute; top: calc(100% + 8px); right: 0;
  min-width: 280px; padding: 8px;
  background: rgba(13, 11, 29, .98);
  border: 1px solid var(--stroke-strong);
  border-radius: 14px;
  box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .65);
  z-index: 50;
}
.user-dropdown.open { display: block; }
.user-dropdown-head {
  padding: 10px 12px 12px; border-bottom: 1px solid var(--stroke); margin-bottom: 6px;
}
.user-dropdown-head .name { font-size: 14px; font-weight: 700; }
.user-dropdown-head .email { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.user-dropdown-body { display: grid; gap: 2px; }
.user-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px; cursor: pointer;
  font-size: 13px; color: var(--text); text-decoration: none;
  background: transparent; border: 0; font: inherit; width: 100%; text-align: left;
}
.user-row:hover { background: var(--surface-2); }
.user-row .ico {
  width: 22px; height: 22px; display: grid; place-items: center;
  color: var(--muted);
}
.user-row.danger { color: #ffb0bd; }
.user-row .badge {
  margin-left: auto; font-size: 10.5px; padding: 1px 7px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--stroke); color: var(--muted);
}
.user-divider { height: 1px; background: var(--stroke); margin: 6px 4px; }

/* Auth / account forms */
.auth-card {
  padding: 28px; max-width: 480px; margin: 0 auto;
  display: grid; gap: 16px;
}
.auth-card h3 { margin: 0; font-size: 18px; }
.auth-card label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.auth-card form { display: grid; gap: 10px; }
.auth-card input {
  background: var(--surface); border: 1px solid var(--stroke); color: var(--text);
  padding: 11px 14px; border-radius: 10px; font: inherit; font-size: 14px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.auth-card input:focus { border-color: rgba(153, 69, 255, .55); box-shadow: 0 0 0 3px rgba(153, 69, 255, .15); }

.auth-section-title {
  font-size: 12px; font-weight: 600; color: var(--muted);
  display: flex; align-items: center; gap: 8px;
  letter-spacing: .04em; text-transform: uppercase;
}
.auth-pill {
  font-size: 9px; padding: 1px 7px; border-radius: 999px;
  background: rgba(20, 241, 149, .18); color: #88f3c3;
  border: 1px solid rgba(20, 241, 149, .35); letter-spacing: .08em;
}

.auth-existing { display: grid; gap: 8px; }
.auth-existing-row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 10px;
  background: var(--surface); border: 1px solid var(--stroke);
}
.auth-existing-row:hover { background: var(--surface-2); }
.auth-existing-row .meta { flex: 1; min-width: 0; }
.auth-existing-row .meta strong { display: block; font-size: 13px; }
.auth-existing-row .meta span { font-size: 11px; color: var(--muted); }

.auth-divider {
  display: flex; align-items: center; gap: 14px;
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted-2); margin: 6px 0;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--stroke);
}

/* Wallet buttons */
.wallet-grid { display: grid; gap: 8px; }
.wallet-btn {
  appearance: none; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  padding: 11px 14px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--stroke);
  color: var(--text); font: inherit; font-size: 14px; text-align: left;
  transition: background .15s, border-color .15s, transform .12s;
}
.wallet-btn:hover {
  background: var(--surface-2); border-color: var(--stroke-strong);
  transform: translateY(-1px);
}
.wallet-btn .wallet-ico {
  width: 32px; height: 32px; flex-shrink: 0; display: inline-grid; place-items: center;
}
.wallet-btn .wallet-ico svg { width: 32px; height: 32px; border-radius: 8px; }
.wallet-btn .wallet-name { flex: 1; min-width: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.wallet-btn .wallet-tag {
  font-size: 9.5px; padding: 1px 7px; border-radius: 999px;
  background: rgba(20, 241, 149, .18); color: #88f3c3;
  border: 1px solid rgba(20, 241, 149, .3);
  letter-spacing: .04em; text-transform: uppercase; font-weight: 600;
}
.wallet-btn .wallet-tag.warn {
  background: rgba(255, 179, 71, .14); color: #ffce91;
  border-color: rgba(255, 179, 71, .3);
}
.wallet-btn .wallet-chev { color: var(--muted); font-size: 16px; transition: transform .15s; }
.wallet-btn:hover .wallet-chev { transform: translateX(3px); color: var(--text); }
.wallet-btn-demo { border-style: dashed; }

.auth-tg {
  width: 100%; justify-content: center;
  padding: 12px 14px; border-radius: 12px; font-size: 14px;
  background: rgba(39, 165, 227, .08);
  border-color: rgba(39, 165, 227, .35);
  color: #a8def0;
}
.auth-tg:hover { background: rgba(39, 165, 227, .14); color: #fff; }

.auth-legal {
  margin: 6px 0 0; padding-top: 12px; border-top: 1px solid var(--stroke);
  font-size: 11px; color: var(--muted-2); line-height: 1.55;
}
.auth-legal a { color: var(--muted); }

/* Watchlist */
/* Trenches live controls */
.live-pill {
  display: inline-flex; align-items: center;
  padding: 4px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
  background: var(--surface); border: 1px solid var(--stroke); color: var(--muted);
}
.live-pill[data-status="live"]       { background: rgba(20,241,149,.14); color: #88f3c3; border-color: rgba(20,241,149,.45); animation: pulse-dot 2s ease-in-out infinite; }
.live-pill[data-status="connecting"] { background: rgba(255,179,71,.14); color: #ffce91; border-color: rgba(255,179,71,.4); }
.live-pill[data-status="error"]      { background: rgba(255,90,118,.12); color: #ffb0bd; border-color: rgba(255,90,118,.4); }
.live-toggle {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px 4px 6px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--stroke);
  font-size: 12px; cursor: pointer; user-select: none;
}
.live-toggle:hover { border-color: var(--stroke-strong); }
.live-toggle input { appearance: none; width: 26px; height: 14px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--stroke-strong); position: relative; cursor: pointer; transition: background .15s; }
.live-toggle input::after { content: ''; position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: left .15s, background .15s; }
.live-toggle input:checked { background: rgba(20,241,149,.3); border-color: rgba(20,241,149,.5); }
.live-toggle input:checked::after { left: 13px; background: var(--pos); }

/* ===== Trenches page (Axiom Pulse-style: 3 dense columns) ===== */
.trenches-cols {
  display: grid; gap: 8px;
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
@media (max-width: 1280px) { .trenches-cols { grid-template-columns: 1fr 1fr; } }
@media (max-width: 820px)  { .trenches-cols { grid-template-columns: 1fr; } }

.trench-col {
  background: #0a0c17;
  border: 1px solid #1c1f2e;
  border-radius: 10px;
  display: flex; flex-direction: column; min-height: 400px;
  max-height: calc(100vh - 200px); overflow: hidden;
}
.trench-col-head {
  display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
  padding: 8px 10px; border-bottom: 1px solid #1c1f2e;
  background: #0d1020;
}
.trench-col-head h3 {
  margin: 0; font-size: 13px; font-weight: 700; color: var(--text);
  letter-spacing: -.005em; flex-shrink: 0;
}
.trench-col-search {
  flex: 1; min-width: 0;
  appearance: none; background: #0a0c17; border: 1px solid #1c1f2e;
  color: var(--text); font: inherit; font-size: 11px;
  padding: 5px 9px; border-radius: 6px;
}
.trench-col-search:focus { outline: none; border-color: #2b3047; background: #11142a; }
.trench-col-search::placeholder { color: #565a76; }
.trench-col-chips {
  display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
}
.tcc {
  appearance: none; cursor: pointer;
  background: transparent; border: 1px solid transparent;
  color: #6a6e8a; padding: 3px 7px; border-radius: 5px;
  font: inherit; font-size: 10.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 3px;
  transition: color .12s, background .12s, border-color .12s;
}
.tcc:hover { color: var(--text); background: #11142a; }
.tcc.active { color: var(--text); background: #1a1d33; border-color: #2b3047; }
.tcc.live { color: #ffd166; }
.tcc-bolt::before { content: '⚡'; font-size: 10px; margin-right: 2px; }
.tcc-bars::before { content: '☰'; font-size: 11px; }
.tcc-cog::before  { content: '⚙'; font-size: 11px; }

.trench-col-body {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column;
}
.trench-col-body::-webkit-scrollbar { width: 6px; }
.trench-col-body::-webkit-scrollbar-thumb { background: #1c1f2e; border-radius: 3px; }
.trench-col-body::-webkit-scrollbar-thumb:hover { background: #2b3047; }

.tr-empty {
  padding: 28px 16px; text-align: center; color: #565a76; font-size: 12px;
}

/* ----- Card (dense horizontal layout) ----- */
.tr-card {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) minmax(118px, auto);
  gap: 10px; padding: 9px 11px;
  border-bottom: 1px solid #14172a;
  cursor: pointer; position: relative;
  background: #0a0c17; transition: background .12s;
}
.tr-card:hover { background: #11142a; }
.tr-card:last-child { border-bottom: 0; }

.tr-side {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  width: 52px; flex-shrink: 0; min-width: 0;
}
.tr-logo {
  width: 48px; height: 48px; border-radius: 8px; flex-shrink: 0;
  object-fit: cover; background: #14172a;
}
.tr-logo.fallback {
  display: grid; place-items: center; color: #0a0820; font-weight: 700; font-size: 13px;
  background: linear-gradient(135deg, #9945ff, #14f195);
}
.tr-mintsuf {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: #565a76; letter-spacing: -.02em;
  max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.tr-main { min-width: 0; display: grid; gap: 3px; align-content: start; overflow: hidden; }

/* Row 1: symbol + name + copy */
.tr-row1 {
  display: flex; align-items: center; gap: 6px; min-width: 0;
  overflow: hidden;
}
.tr-sym {
  font-weight: 700; font-size: 13px; color: var(--text);
  letter-spacing: -.005em; flex-shrink: 0; max-width: 110px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tr-name-text {
  font-size: 12px; color: #8c87b3; font-weight: 500;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  min-width: 0; flex: 1;
}
.tr-copy {
  appearance: none; background: transparent; border: 0; cursor: pointer;
  color: #565a76; font-size: 11px; padding: 0; line-height: 1;
  transition: color .12s; flex-shrink: 0;
}
.tr-copy:hover { color: var(--text); }

/* Row 2: age, icons, social, holders */
.tr-row2 {
  display: flex; align-items: center; gap: 7px; min-width: 0;
  font-size: 10.5px; color: #8c87b3; font-variant-numeric: tabular-nums;
  overflow: hidden;
}
.tr-age { color: var(--text); font-weight: 500; flex-shrink: 0; }
.tr-time-left {
  display: inline-flex; align-items: center; gap: 3px;
  color: #ff9559; font-weight: 600; font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.tr-time-left::before { content: '🔥'; font-size: 9px; filter: grayscale(.2); }
.tr-icons { display: inline-flex; align-items: center; gap: 4px; color: #6a6e8a; flex-shrink: 0; }
.tr-icons a, .tr-icons span {
  display: inline-grid; place-items: center;
  height: 14px; border-radius: 3px;
  color: inherit; text-decoration: none; font-size: 10.5px;
  transition: color .12s;
  padding: 0 2px;
}
.tr-icons a:hover { color: var(--text); }
.tr-icons .ic-on { color: #88f3c3; }
.tr-handle {
  color: #6a6e8a; font-size: 10px; flex-shrink: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tr-handle .h { color: #88aafc; }

/* Row 3: risk/holder badges (must stay one line) */
.tr-row3 {
  display: flex; align-items: center; gap: 8px;
  font-size: 10.5px; font-variant-numeric: tabular-nums;
  margin-top: 1px; min-width: 0;
  overflow: hidden;
}
.tr-stat {
  display: inline-flex; align-items: center; gap: 2px;
  color: #6a6e8a; font-weight: 600; letter-spacing: -.005em;
  flex-shrink: 0;
}
.tr-stat .v { color: #b0aede; }
.tr-stat.pos .v { color: #14f195; }
.tr-stat.neg .v { color: #ff5a76; }
.tr-stat.warn .v { color: #ffce91; }
.tr-stat .ic { display: inline-grid; place-items: center; font-size: 10.5px; line-height: 1; }
.tr-stat .lbl { color: #565a76; font-size: 9.5px; letter-spacing: .04em; }

.tr-paid {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 1px 5px; border-radius: 4px; font-size: 9px; font-weight: 700;
  background: rgba(20,241,149,.14); color: #88f3c3; border: 1px solid rgba(20,241,149,.3);
  text-transform: none; letter-spacing: .02em; flex-shrink: 0;
}
.tr-ds {
  padding: 1px 4px; border-radius: 4px; font-size: 9px; font-weight: 700;
  background: #14172a; color: #6a6e8a; border: 1px solid #1c1f2e;
  letter-spacing: .04em; flex-shrink: 0;
}

/* Right side: V/MC + F/TX + sparkline (own row) + buy button */
.tr-right {
  display: grid; gap: 3px;
  grid-template-rows: auto auto auto auto;
  align-content: start; justify-items: end;
  text-align: right; min-width: 0;
}
.tr-vmc {
  display: flex; gap: 8px; font-size: 11px; font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tr-vmc .lbl { color: #565a76; font-weight: 500; margin-right: 2px; font-size: 9.5px; }
.tr-vmc .v   { color: #14f195; font-weight: 700; }
.tr-vmc .mc  { color: #ffd166; font-weight: 700; }

.tr-ftx {
  display: flex; align-items: center; gap: 8px;
  font-size: 10px; color: #6a6e8a; font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.tr-ftx .lbl { color: #565a76; margin-right: 2px; }
.tr-ftx .val { color: #b0aede; font-weight: 600; }

.tr-spark {
  width: 100%; max-width: 130px; height: 16px; display: block;
}
.tr-spark path.line { fill: none; stroke-width: 1.4; }
.tr-spark path.area { opacity: .2; }
.tr-spark.pos path.line { stroke: #14f195; }
.tr-spark.pos path.area { fill: #14f195; }
.tr-spark.neg path.line { stroke: #ff5a76; }
.tr-spark.neg path.area { fill: #ff5a76; }

.tr-buybtn {
  appearance: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 4px;
  background: linear-gradient(180deg, #5b6cff, #4858e8);
  color: #fff; border: 1px solid #6a7aff;
  font: inherit; font-size: 11px; font-weight: 700;
  padding: 4px 10px; border-radius: 6px;
  letter-spacing: -.005em;
  box-shadow: 0 3px 10px -4px rgba(91, 108, 255, .55);
  transition: transform .12s, filter .12s;
  margin-top: 1px; white-space: nowrap;
}
.tr-buybtn::before { content: '⚡'; font-size: 10.5px; }
.tr-buybtn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.tr-buybtn:active { transform: translateY(0); }

/* Card freshness highlight (for newly-streamed tokens) */
@keyframes tr-flash {
  0%   { background: rgba(20,241,149,.12); }
  100% { background: #0a0c17; }
}
.tr-card.fresh { animation: tr-flash 3.5s ease-out 1; }

/* Top stats strip (compact, single line) */
.trenches-strip {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
  padding: 8px 14px; border-radius: 8px;
  background: #0a0c17; border: 1px solid #1c1f2e;
  margin-bottom: 8px;
  font-size: 11.5px; color: #8c87b3;
}
.trenches-strip .ts-pair {
  display: inline-flex; align-items: baseline; gap: 6px;
}
.trenches-strip .ts-lbl {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em; color: #565a76; font-weight: 600;
}
.trenches-strip .ts-val { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
.trenches-strip .ts-val.pos { color: #14f195; }
.trenches-strip .ts-val.neg { color: #ff5a76; }

/* Live status pill compact */
.trenches-strip .live-pill { font-size: 10px; padding: 2px 7px; }

/* ===== Token Detail Page (Padre/Axiom-style trader cockpit) ===== */
.tk-page {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 12px;
}
@media (max-width: 1180px) { .tk-page { grid-template-columns: 1fr; } }

.tk-main {
  display: grid; gap: 10px; min-width: 0;
  grid-template-rows: auto auto 1fr;
}

/* Header strip */
.tk-header {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px; align-items: center;
  padding: 10px 14px; border-radius: 10px;
  background: #0a0c17; border: 1px solid #1c1f2e;
}
.tk-id { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tk-logo {
  width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
  background: #14172a; object-fit: cover;
}
.tk-logo.fallback {
  display: grid; place-items: center; color: #0a0820; font-weight: 700; font-size: 14px;
  background: linear-gradient(135deg, #9945ff, #14f195);
}
.tk-titleblk { min-width: 0; }
.tk-name {
  display: flex; align-items: center; gap: 8px; min-width: 0;
  font-size: 16px; font-weight: 700; color: var(--text);
}
.tk-name .pair { color: var(--muted); font-weight: 500; font-size: 14px; }
.tk-meta {
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  font-size: 11px; color: var(--muted); margin-top: 3px;
}
.tk-meta .age { color: var(--text); font-weight: 500; }
.tk-meta a {
  color: var(--muted); text-decoration: none;
  display: inline-grid; place-items: center;
  width: 16px; height: 16px; border-radius: 4px;
  font-size: 12px; transition: color .12s;
}
.tk-meta a:hover { color: var(--text); }
.tk-meta .name-sub { color: var(--text); font-weight: 500; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tk-price-big {
  font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums;
  letter-spacing: -.01em; color: var(--text);
  text-align: center; padding: 0 14px;
}

.tk-stats-row {
  display: flex; gap: 18px; align-items: center; flex-wrap: nowrap; flex-shrink: 0;
}
.tk-stat {
  display: grid; gap: 1px; min-width: 60px;
}
.tk-stat .lbl {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: .08em;
  color: #565a76; font-weight: 600;
}
.tk-stat .val {
  font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums;
  color: var(--text); white-space: nowrap;
}
.tk-stat .val.pos { color: #14f195; }
.tk-stat .val.neg { color: #ff5a76; }
.tk-stat .val.dim { color: var(--muted); font-weight: 500; }

/* Chart card */
.tk-chart-card {
  background: #0a0c17; border: 1px solid #1c1f2e; border-radius: 10px;
  overflow: hidden; min-height: 480px;
}
.tk-chart-card iframe {
  display: block; width: 100%; height: 480px; border: 0;
  background: #0a0c17;
}
.tk-chart-card .chart-fallback {
  height: 480px; display: grid; place-items: center;
  color: #565a76; font-size: 13px; padding: 20px; text-align: center;
}

/* Tabs + bottom panel */
.tk-tabs {
  display: flex; gap: 2px; padding: 6px 6px 0;
  border-bottom: 1px solid #1c1f2e;
  background: #0a0c17;
}
.tk-tab {
  appearance: none; background: transparent; border: 0; cursor: pointer;
  font: inherit; font-size: 12px; font-weight: 600; color: var(--muted);
  padding: 9px 14px; border-radius: 6px 6px 0 0;
  transition: color .12s, background .12s; position: relative;
  display: inline-flex; align-items: center; gap: 4px;
}
.tk-tab:hover { color: var(--text); }
.tk-tab.active { color: var(--text); background: #11142a; }
.tk-tab.active::after {
  content: ''; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px;
  background: linear-gradient(90deg, #5b6cff, #9945ff); border-radius: 2px;
}
.tk-tab .count {
  color: var(--muted-2); font-weight: 500; font-size: 11px; margin-left: 2px;
}
.tk-bottom {
  background: #0a0c17; border: 1px solid #1c1f2e; border-radius: 10px;
  overflow: hidden; min-height: 280px;
}
.tk-bottom-body { padding: 0; max-height: 380px; overflow-y: auto; }
.tk-bottom-body::-webkit-scrollbar { width: 6px; }
.tk-bottom-body::-webkit-scrollbar-thumb { background: #1c1f2e; border-radius: 3px; }
.tk-bottom-body table {
  width: 100%; border-collapse: collapse; font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}
.tk-bottom-body th {
  text-align: left; font-weight: 600; font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; color: #565a76;
  padding: 8px 12px; border-bottom: 1px solid #14172a;
  background: #0d1020; position: sticky; top: 0; z-index: 1;
}
.tk-bottom-body th.num, .tk-bottom-body td.num { text-align: right; }
.tk-bottom-body td {
  padding: 8px 12px; border-bottom: 1px solid #14172a;
  color: var(--text); white-space: nowrap;
}
.tk-bottom-body tr:hover td { background: #0e1224; }
.tk-bottom-body td.muted { color: var(--muted); }
.tk-bottom-body .empty {
  padding: 40px 20px; text-align: center; color: #565a76; font-size: 12px;
}

/* Right side trading panel */
.tk-side {
  display: grid; gap: 10px; align-content: start;
}
.tk-card {
  background: #0a0c17; border: 1px solid #1c1f2e; border-radius: 10px;
  padding: 12px;
}
.tk-card h4 {
  margin: 0 0 10px; font-size: 12px; font-weight: 700; color: var(--text);
  display: flex; align-items: center; justify-content: space-between;
}
.tk-card h4 .toggle {
  cursor: pointer; color: var(--muted); font-size: 11px;
}

.tk-wallet-row {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px; border-radius: 8px;
  background: #11142a; border: 1px solid #1c1f2e;
  font-size: 12px;
}
.tk-wallet-row .av {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  background: linear-gradient(135deg, #9945ff, #14f195);
}
.tk-wallet-row .lbl { color: var(--text); font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tk-wallet-row .bal { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
.tk-wallet-row .bal .sol { color: var(--muted); font-weight: 500; margin-left: 2px; font-size: 11px; }

.tk-bs-tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  padding: 3px; background: #11142a; border-radius: 8px; margin: 10px 0 8px;
}
.tk-bs-tabs button {
  appearance: none; cursor: pointer;
  background: transparent; border: 0;
  font: inherit; font-size: 12.5px; font-weight: 700;
  color: var(--muted); padding: 7px;
  border-radius: 6px; transition: background .12s, color .12s;
}
.tk-bs-tabs button.buy.active  { background: rgba(20,241,149,.18); color: #88f3c3; }
.tk-bs-tabs button.sell.active { background: rgba(255,90,118,.18); color: #ffb0bd; }

.tk-mode-row {
  display: flex; gap: 6px; align-items: center;
  margin-bottom: 8px;
}
.tk-mode-row select {
  flex: 1; appearance: none;
  background: #11142a; border: 1px solid #1c1f2e; color: var(--text);
  font: inherit; font-size: 12px; padding: 6px 8px; border-radius: 6px;
}

.tk-amt-input {
  display: flex; align-items: center;
  background: #11142a; border: 1px solid #1c1f2e; border-radius: 8px;
  padding: 9px 12px; margin-bottom: 8px;
}
.tk-amt-input .lbl { color: var(--muted); font-size: 11px; flex: 1; }
.tk-amt-input input {
  appearance: none; background: transparent; border: 0; outline: none;
  color: var(--text); font: inherit; font-size: 14px; font-weight: 700;
  text-align: right; width: 100%; min-width: 0; font-variant-numeric: tabular-nums;
  padding: 0;
}
.tk-amt-input .unit { color: var(--text); font-size: 12px; font-weight: 700; margin-left: 6px; }

.tk-quick {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 10px;
}
.tk-quick button {
  appearance: none; cursor: pointer;
  background: #11142a; border: 1px solid #1c1f2e; color: var(--text);
  font: inherit; font-size: 11px; font-weight: 600;
  padding: 6px 0; border-radius: 6px;
  transition: background .12s, border-color .12s;
}
.tk-quick button:hover { background: #1a1d33; border-color: #2b3047; }
.tk-quick button.edit { color: var(--muted); font-size: 11px; }

.tk-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
  font-size: 11.5px; color: var(--muted);
}
.tk-row label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
.tk-row input[type="checkbox"] { accent-color: #5b6cff; }

.tk-gas {
  display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  font-size: 10.5px; color: var(--muted);
